
<script>

/*
============================================================
FILE : MatchingScript.html
MODULE : Matching UI
PURPOSE : Matching Profiles inside existing chatbot

IMPORTANT
------------------------------------------------------------
1. Matching Profiles separate page/modal मध्ये उघडणार नाही.
2. Matching profiles existing chatbot #chat मध्ये render होतील.
3. Existing ranking backend unchanged.
4. Existing Like / Dislike backend unchanged.
5. Existing Send Interest backend unchanged.
6. Existing View Profile function unchanged.
7. Existing Profile components reused.
8. Matching reaction state is handled locally for Matching UI.
============================================================
*/


// ==========================================================
// MATCHING STATE
// ==========================================================

let matchingRenderedProfiles = [];

// ==========================================================
// MATCHING PAGINATION STATE
// ==========================================================

let matchingAllRankedProfiles = [];

let matchingCurrentPage = 1;

const MATCHING_PAGE_SIZE = 10;

let matchingViewMoreLoading = false;

let matchingLastRankingResult = null;

let matchingReactionState = {};

let matchingTypewriterTimer = null;

// ----------------------------------------------------------
// MATCHING INITIAL LOAD SYNCHRONIZATION
// ----------------------------------------------------------

let matchingTypewriterDone = false;
let matchingProfilesReady = false;

// ==========================================================
// MATCHING REACTION KEY
// ==========================================================

function getMatchingReactionKey(
    type,
    profileId
) {

    return (
        String(type || "")
            .trim()
            .toLowerCase()
        +
        "_"
        +
        String(profileId || "")
            .trim()
    );

}


// ==========================================================
// SAFE VALUE
// ==========================================================

function matchingSafeString(
    value
) {

    return String(
        value === undefined ||
        value === null
            ? ""
            : value
    ).trim();

}


// ==========================================================
// ESCAPE JS
// ==========================================================

function matchingEscapeJs(
    value
) {

    if (
        typeof escapeJsValue ===
        "function"
    ) {

        return escapeJsValue(
            matchingSafeString(value)
        );

    }

    return matchingSafeString(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");

}


// ==========================================================
// GET CHAT
// ==========================================================

function getMatchingChat() {

    return document.getElementById(
        "chat"
    );

}


// ==========================================================
// MATCHING INITIAL RENDER GUARD
//
// Profiles render only when:
// 1. Typewriter is complete
// 2. Matching profile data + relationship states are ready
//
// Backend loading remains parallel.
// ==========================================================

function tryRenderMatchingProfilesWhenReady(
    profiles,
    rankingResult,
    appendMode
) {

    // ------------------------------------------------------
    // WAIT UNTIL TYPEWRITER IS COMPLETE
    // ------------------------------------------------------

    if (matchingTypewriterDone !== true) {

        console.log(
            "MATCHING RENDER WAITING FOR TYPEWRITER."
        );

        return;

    }


    // ------------------------------------------------------
    // WAIT UNTIL PROFILES ARE READY
    // ------------------------------------------------------

    if (matchingProfilesReady !== true) {

        console.log(
            "MATCHING RENDER WAITING FOR PROFILE DATA."
        );

        return;

    }


    // ------------------------------------------------------
    // BOTH ARE READY
    // ------------------------------------------------------

    console.log(
        "MATCHING TYPEWRITER + PROFILES READY. RENDERING NOW."
    );


    renderMatchingProfilesInChat(
        profiles,
        rankingResult,
        appendMode
    );

}

// ==========================================================
// MATCHING LOADING MESSAGE
// ==========================================================

function showMatchingLoadingInChat() {

    const chat =
        getMatchingChat();

    if (!chat) {

        console.error(
            "MATCHING CHAT NOT FOUND."
        );

        return;
    }


    // ------------------------------------------------------
    // CLEAR PREVIOUS TYPEWRITER
    // ------------------------------------------------------

    if (
        matchingTypewriterTimer
    ) {

        clearInterval(
            matchingTypewriterTimer
        );

        matchingTypewriterTimer = null;

    }


    // ------------------------------------------------------
    // LOADING MESSAGE
    // ------------------------------------------------------

    botMessage(`
        <div
            class="matching-chat-loading"
            id="matchingLoadingMessage"
        >

            <div class="matching-chat-loading-icon">
                ❤️
            </div>


            <div class="matching-chat-loading-title">
                Finding your best matches...
            </div>


            <div
                class="matching-chat-loading-message"
                id="matchingTypewriterText"
            ></div>

        </div>
    `);


    // ------------------------------------------------------
    // TYPEWRITER TEXT
    // ------------------------------------------------------

    const textElement =
        document.getElementById(
            "matchingTypewriterText"
        );


    if (!textElement) {
        return;
    }


    const message =
    "आम्ही तुमच्यासाठी जुळणारे प्रोफाइल कसे शोधतो: " +

    "आम्ही तुमच्या प्रोफाइलची इतर नोंदणीकृत प्रोफाइलसोबत मूलभूत सुसंगततेच्या आधारावर तुलना करतो, " +

    "तुमच्या जोडीदाराच्या अपेक्षा, त्यांच्या तुमच्याकडून असलेल्या अपेक्षा आणि एकूण प्रोफाइल सुसंगतता तपासतो. " +

    "त्यानंतर प्रत्येक सुसंगत प्रोफाइलला गुण दिले जातात आणि त्यांची क्रमवारी लावली जाते, " +

    "जेणेकरून सर्वात योग्य जुळणारे प्रोफाइल प्रथम दिसतील. " +

    "आम्ही तुमच्यासाठी सर्वात योग्य प्रोफाइल शोधत आहोत, कृपया प्रतीक्षा करा...";


      let currentIndex = 0;


      matchingTypewriterTimer =
          setInterval(
              function() {

                
                if (
                      currentIndex >=
                      message.length
                  ) {

                      clearInterval(
                          matchingTypewriterTimer
                      );

                      matchingTypewriterTimer =
                          null;


                      // ------------------------------------------------------
                      // TYPEWRITER COMPLETED
                      // ------------------------------------------------------

                      matchingTypewriterDone = true;

                      console.log(
                          "MATCHING TYPEWRITER COMPLETED."
                      );


                      // ------------------------------------------------------
                      // CHECK WHETHER PROFILES ARE ALSO READY
                      // ------------------------------------------------------

                      tryRenderMatchingProfilesWhenReady(
                          matchingRenderedProfiles,
                          matchingLastRankingResult,
                          false
                      );


                      return;
                  }


                  // ----------------------------------------------
                  // TYPE NEXT CHARACTER
                  // ----------------------------------------------

                  textElement.textContent +=
                      message.charAt(
                          currentIndex
                      );


                  currentIndex++;


                  // ----------------------------------------------
                  // AUTO SCROLL WITH TYPEWRITER
                  // ----------------------------------------------

                  const chat =
                      getMatchingChat();

                  if (chat) {

                      chat.scrollTop =
                          chat.scrollHeight;

                  }


              },
              70
          );

}


// ==========================================================
// SHOW ERROR
// ==========================================================

function showMatchingErrorInChat(
    message
) {

    botMessage(`

        <div class="matching-chat-error">

            <div class="matching-chat-error-icon">
                ⚠️
            </div>

            <div class="matching-chat-error-title">
                Unable to load matching profiles.
            </div>

            <div class="matching-chat-error-message">

                ${
                    escapeHtml(
                        message ||
                        "Please try again."
                    )
                }

            </div>

            <button
                type="button"
                class="matching-chat-retry-btn"
                onclick="loadMatchingProfiles()"
            >

                🔄 Retry

            </button>

        </div>

    `);

}


// ==========================================================
// NO MATCHES
// ==========================================================

function showMatchingNoResultsInChat() {

    botMessage(`

        <div class="matching-chat-empty">

            <div class="matching-chat-empty-icon">
                💔
            </div>

            <div class="matching-chat-empty-title">
                No Matching Profiles Found
            </div>

            <div class="matching-chat-empty-message">

                No compatible profiles are available
                at this time.

            </div>

        </div>

    `);

}


// ==========================================================
// MATCHING HEADER
// ==========================================================

function showMatchingChatHeader(
    rankingResult,
    profileCount,
    startRank,
    endRank
) {

    const summary =
        rankingResult &&
        rankingResult.summary
            ? rankingResult.summary
            : {};


    const totalCandidates =
        Number(
            summary.totalCandidates
        ) || 0;


    const viewerName =
        matchingSafeString(
            summary.viewerName
        );


    const countText =
        String(
            profileCount
        );


    // ------------------------------------------------------
    // DYNAMIC RANK RANGE
    // ------------------------------------------------------

    const hasRankRange =
        Number.isFinite(
            Number(startRank)
        ) &&
        Number.isFinite(
            Number(endRank)
        );


    const rankRangeText =
        hasRankRange
            ? `${Number(startRank)}–${Number(endRank)}`
            : countText;


    botMessage(`

        <div class="matching-chat-header">

            <div class="matching-chat-header-row">

                <div class="matching-chat-title">

                    ❤️ Matching Profiles

                    <span class="matching-chat-count">
                        (${countText})
                    </span>

                </div>

            </div>


            <div class="matching-chat-summary">

                ${
                    viewerName
                        ? `
                            <b>
                                ${escapeHtml(viewerName)}
                            </b>
                            साठी
                        `
                        : ""
                }

                Top

                <b>
                    ${rankRangeText}
                </b>

                compatible profiles

                ${
                    totalCandidates > 0
                        ? `
                            out of
                            <b>
                                ${totalCandidates}
                            </b>
                            profiles
                        `
                        : ""
                }

                found.

            </div>

        </div>

    `);

}

// ==========================================================
// SHOW MATCHING PROFILES
// ==========================================================

function showMatchingProfiles() {

    console.log(
        "MATCHING UI OPENED"
    );


    // ------------------------------------------------------
    // VERIFIED USER
    // ------------------------------------------------------

    const viewerId =
        matchingSafeString(
            typeof profileUserId !==
            "undefined"
                ? profileUserId
                : ""
        );


    const viewerType =
        matchingSafeString(
            typeof profileUserType !==
            "undefined"
                ? profileUserType
                : ""
        )
        .toLowerCase();


    const verified =
        (
            typeof profileAccessVerified !==
            "undefined"
        )
            ? profileAccessVerified
            : false;


    console.log(
        "MATCHING VERIFIED USER:",
        {
            profileUserId:
                viewerId,

            profileUserType:
                viewerType,

            profileAccessVerified:
                verified,

            profileUserMobile:
                typeof profileUserMobile !==
                "undefined"
                    ? profileUserMobile
                    : ""
        }
    );


    if (
        !verified ||
        !viewerId ||
        !viewerType
    ) {

        console.error(
            "MATCHING USER PROFILE INFORMATION MISSING:",
            {
                viewerId:
                    viewerId,

                viewerType:
                    viewerType
            }
        );


        botMessage(`

            🔐 <b>Verification Required</b>

            <br><br>

            Matching Profiles पाहण्यासाठी
            प्रथम Registered Mobile Number Verify करा.

        `);

        return;

    }


    // ------------------------------------------------------
    // RESET MATCHING STATE
    // ------------------------------------------------------

    matchingRenderedProfiles = [];

    matchingAllRankedProfiles = [];

    matchingCurrentPage = 1;

    matchingLastRankingResult = null;

    matchingReactionState = {};

    matchingTypewriterDone = false;
    matchingProfilesReady = false;

    // ------------------------------------------------------
    // CHATBOT VISIBLE
    // ------------------------------------------------------

    const chatbotWrapper =
        document.getElementById(
            "chatbotWrapper"
        );


    if (chatbotWrapper) {

        chatbotWrapper.style.display =
            "block";

    }


    // ------------------------------------------------------
    // LOAD
    // ------------------------------------------------------

    loadMatchingProfiles();

}


// ==========================================================
// LOAD MATCHING PROFILES
// ==========================================================

function loadMatchingProfiles() {

    const viewerId =
        matchingSafeString(
            typeof profileUserId !==
            "undefined"
                ? profileUserId
                : ""
        );

    const viewerType =
        matchingSafeString(
            typeof profileUserType !==
            "undefined"
                ? profileUserType
                : ""
        )
        .toLowerCase();

    if (
        !viewerId ||
        !viewerType
    ) {

        console.error(
            "MATCHING USER PROFILE INFORMATION MISSING:",
            {
                viewerId: viewerId,
                viewerType: viewerType
            }
        );

        showMatchingErrorInChat(
            "User profile information is not available."
        );

        return;
    }

    console.log(
        "MATCHING RANKING REQUEST:",
        {
            viewerId: viewerId,
            viewerType: viewerType
        }
    );

    showMatchingLoadingInChat();


    google.script.run

        .withSuccessHandler(
            function(result) {

                console.log(
                    "MATCHING RANKING RESULT:",
                    result
                );

                if (
                    !result ||
                    result.success !== true
                ) {

                    showMatchingErrorInChat(
                        result &&
                        result.message
                            ? result.message
                            : "Unable to load matching profiles."
                    );

                    return;
                }

                matchingLastRankingResult =
                    result;

                // ======================================================
                // STORE COMPLETE RANKED RESULT
                //
                // Backend already returns:
                // - top10
                // - allResults
                //
                // We keep the complete ranked list locally.
                // No ranking logic is changed here.
                // ======================================================

                const allRankedProfiles =
                    Array.isArray(result.allResults)
                        ? result.allResults
                        : (
                            Array.isArray(result.top10)
                                ? result.top10
                                : []
                        );


                if (
                    allRankedProfiles.length === 0
                ) {

                    showMatchingNoResultsInChat();

                    return;

                }


                // ======================================================
                // INITIAL PAGE
                // ======================================================

                matchingAllRankedProfiles =
                    allRankedProfiles.slice();

                matchingCurrentPage = 1;


                const initialProfiles =
                    matchingAllRankedProfiles.slice(
                        0,
                        MATCHING_PAGE_SIZE
                    );


                matchingRenderedProfiles =
                    initialProfiles.slice();


                // ======================================================
                // LOAD EXISTING REACTION STATES
                // ======================================================

                loadMatchingReactionStates(
                    initialProfiles,
                    result
                );

            }
        )

        .withFailureHandler(
            function(error) {

                console.error(
                    "MATCHING RANKING ERROR:",
                    error
                );

                showMatchingErrorInChat(
                    error &&
                    error.message
                        ? error.message
                        : "Unable to load matching profiles."
                );

            }
        )

        .calculateActualProfileRanking(
            viewerId,
            viewerType
        );

}


      // ==========================================================
      // RENDER MATCHING PROFILES IN CHAT
      //
      // IMPORTANT:
      // This is the ONLY matching render function.
      //
      // DO NOT rename this to renderMatchingProfiles.
      // ==========================================================

      function renderMatchingProfilesInChat(
          profiles,
          rankingResult,
          appendMode
      ) {

          const safeProfiles =
              Array.isArray(
                  profiles
              )
                  ? profiles
                  : [];


              const loadingMessage =
                  document.getElementById(
                      "matchingLoadingMessage"
                  );

              if (loadingMessage) {

                  loadingMessage.remove();

              }


          // ======================================================
          // REMEMBER WHERE THIS NEW BATCH STARTS
          // ======================================================

          const chat =
              getMatchingChat();

          const matchingCardStartIndex =
              chat
                  ? chat.querySelectorAll(
                      ".matching-profile-card"
                    ).length
                  : 0;


          if (
              safeProfiles.length === 0
          ) {

              showMatchingNoResultsInChat();

              return;

          }


              // ======================================================
              // DYNAMIC MATCHING BATCH HEADER
              // ======================================================

              const batchStartRank =
                  matchingRenderedProfiles.length -
                  safeProfiles.length +
                  1;


              const batchEndRank =
                  matchingRenderedProfiles.length;


              showMatchingChatHeader(
                  rankingResult,
                  safeProfiles.length,
                  batchStartRank,
                  batchEndRank
              );


            safeProfiles.forEach(
                function(
                    profile,
                    index
                ) {

                    const cardHtml =
                        buildMatchingProfileCard(
                            profile,
                            index
                        );


                    if (
                        cardHtml
                    ) {

                        botMessage(
                            cardHtml
                        );

                    }

                }
            );


            console.log(
                "MATCHING PROFILES RENDERED:",
                {
                    count:
                        safeProfiles.length,

                    totalCandidates:
                        rankingResult &&
                        rankingResult.summary
                            ? rankingResult.summary.totalCandidates
                            : 0
                }
            );

            matchingViewMoreLoading = false;

            // ======================================================
            // MATCHING PAGINATION CONTROLS
            // ======================================================

            renderMatchingPaginationControls();


            // ======================================================
            // SCROLL TO FIRST PROFILE OF CURRENT BATCH
            // ======================================================

            scrollToMatchingBatchStart(
                matchingCardStartIndex
            );

      }



    // ==========================================================
    // SCROLL TO FIRST PROFILE OF CURRENT MATCHING BATCH
    // ==========================================================
    //
    // Initial batch:
    // #1–#10  → scroll to #1
    //
    // View More:
    // #11–#20 → scroll to #11
    // #21–#30 → scroll to #21
    // #31–#40 → scroll to #31
    //
    // Uses the first newly rendered matching card.
    // ==========================================================

    function scrollToMatchingBatchStart(
        matchingCardStartIndex
    ) {

        setTimeout(
            function() {

                const chat =
                    getMatchingChat();


                if (!chat) {
                    return;
                }


                const matchingCards =
                    chat.querySelectorAll(
                        ".matching-profile-card"
                    );


                const targetCard =
                    matchingCards[
                        matchingCardStartIndex
                    ];


                if (!targetCard) {

                    console.warn(
                        "MATCHING BATCH SCROLL TARGET NOT FOUND:",
                        {
                            matchingCardStartIndex:
                                matchingCardStartIndex,

                            totalMatchingCards:
                                matchingCards.length
                        }
                    );

                    return;
                }


                const chatRect =
                    chat.getBoundingClientRect();


                const cardRect =
                    targetCard.getBoundingClientRect();


                const targetTop =
                    chat.scrollTop +
                    cardRect.top -
                    chatRect.top -
                    10;


                chat.scrollTo({

                    top:
                        Math.max(
                            0,
                            targetTop
                        ),

                    behavior:
                        "smooth"

                });


                console.log(
                    "MATCHING BATCH SCROLL:",
                    {
                        batchStartIndex:
                            matchingCardStartIndex,

                        targetProfile:
                            targetCard
                                .getAttribute(
                                    "data-matching-profile-id"
                                ),

                        targetTop:
                            targetTop
                    }
                );

            },
            100
        );

    }


// ==========================================================
// MATCHING PAGINATION CONTROLS
// ==========================================================
//
// Purpose:
// - Show View More (10) when more ranked profiles exist.
// - Keep Main Menu available.
// - Never modify ranking or reaction logic.
// ==========================================================

function renderMatchingPaginationControls() {

    const chat =
        getMatchingChat();


    if (!chat) {

        console.warn(
            "MATCHING CHAT NOT FOUND FOR PAGINATION."
        );

        return;

    }


    // ------------------------------------------------------
    // REMOVE OLD PAGINATION CONTROLS
    // ------------------------------------------------------

    const oldControls =
        document.querySelectorAll(
            ".matching-pagination-controls"
        );


    oldControls.forEach(
        function(control) {

            control.remove();

        }
    );


    // ------------------------------------------------------
    // CHECK REMAINING PROFILES
    // ------------------------------------------------------

    const totalProfiles =
        Array.isArray(
            matchingAllRankedProfiles
        )
            ? matchingAllRankedProfiles.length
            : 0;


    const displayedProfiles =
        Array.isArray(
            matchingRenderedProfiles
        )
            ? matchingRenderedProfiles.length
            : 0;


    const hasMoreProfiles =
        displayedProfiles < totalProfiles;


    // ------------------------------------------------------
    // BUTTONS
    // ------------------------------------------------------

    const viewMoreButton =
        hasMoreProfiles
            ? `
                <button
                    type="button"
                    class="matching-view-more-btn"
                    onclick="showMoreMatchingProfiles()"
                >
                    View More (10)
                </button>
            `
            : "";


    const controlsHtml = `

        <div
            class="matching-pagination-controls"
            style="
              text-align: center;
            "
        >

            ${viewMoreButton}

            <button
                type="button"
                class="matching-main-menu-btn"
                onclick="showMenu()"
            >
                🏠 Main Menu
            </button>

        </div>

    `;


    botMessage(
        controlsHtml
    );


    console.log(
        "MATCHING PAGINATION:",
        {
            displayedProfiles:
                displayedProfiles,

            totalProfiles:
                totalProfiles,

            currentPage:
                matchingCurrentPage,

            hasMoreProfiles:
                hasMoreProfiles
        }
    );

}


// ==========================================================
// SHOW NEXT 10 MATCHING PROFILES
// ==========================================================

function showMoreMatchingProfiles() {


        // ------------------------------------------------------
    // PREVENT DOUBLE CLICK
    // ------------------------------------------------------

    if (
        matchingViewMoreLoading === true
    ) {

        console.log(
            "VIEW MORE ALREADY LOADING."
        );

        return;
    }


    // ------------------------------------------------------
    // LOCK VIEW MORE
    // ------------------------------------------------------

    matchingViewMoreLoading = true;


    // ------------------------------------------------------
    // SHOW LOADING STATE
    // ------------------------------------------------------

    const viewMoreButtons =
        document.querySelectorAll(
            ".matching-view-more-btn"
        );


    viewMoreButtons.forEach(
        function(button) {

            button.disabled = true;

            button.setAttribute(
                "aria-disabled",
                "true"
            );

            button.innerHTML =
                "⏳ Loading next 10 profiles...";

            button.classList.add(
                "matching-view-more-loading"
            );

        }
    );


    console.log(
        "VIEW MORE LOADING STARTED:",
        {
            currentPage:
                matchingCurrentPage
        }
    );


    const totalProfiles =
        Array.isArray(
            matchingAllRankedProfiles
        )
            ? matchingAllRankedProfiles.length
            : 0;


    const currentCount =
        Array.isArray(
            matchingRenderedProfiles
        )
            ? matchingRenderedProfiles.length
            : 0;


    if (
        currentCount >= totalProfiles
    ) {

        console.log(
            "NO MORE MATCHING PROFILES."
        );

        renderMatchingPaginationControls();

        return;

    }


    // ------------------------------------------------------
    // CALCULATE NEXT BATCH
    // ------------------------------------------------------

    const startIndex =
        currentCount;


    const endIndex =
        Math.min(
            startIndex +
                MATCHING_PAGE_SIZE,

            totalProfiles
        );


    const nextProfiles =
        matchingAllRankedProfiles.slice(
            startIndex,
            endIndex
        );


        nextProfiles.forEach(
            function(profile, index) {

                if (!profile) {
                    return;
                }

                profile._matchingDisplayIndex =
                    startIndex + index;

            }
        );


    if (
        nextProfiles.length === 0
    ) {

        renderMatchingPaginationControls();

        return;

    }


    // ------------------------------------------------------
    // UPDATE PAGE STATE
    // ------------------------------------------------------

    matchingCurrentPage++;


    matchingRenderedProfiles =
        matchingRenderedProfiles.concat(
            nextProfiles
        );


    console.log(
        "MATCHING NEXT PAGE:",
        {
            page:
                matchingCurrentPage,

            startIndex:
                startIndex,

            endIndex:
                endIndex,

            added:
                nextProfiles.length,

            totalDisplayed:
                matchingRenderedProfiles.length,

            totalAvailable:
                totalProfiles
        }
    );


    // ------------------------------------------------------
    // LOAD REACTION STATES FOR NEW PROFILES
    // ------------------------------------------------------

    loadMatchingReactionStates(
        nextProfiles,
        matchingLastRankingResult,
        true
    );

}





// ==========================================================
// BUILD MATCHING PROFILE CARD
// ==========================================================

function buildMatchingProfileCard(
    profile,
    index
) {

    profile = profile || {};

    const displayData =
        prepareProfileDisplayData(
            profile,
            profile.type || ""
        );

    const profileType =
        matchingSafeString(
            displayData.currentProfileType ||
            profile.type
        ).toLowerCase();

    const profileId =
        matchingSafeString(
            displayData.currentProfileId ||
            profile.id
        );

    const profileName =
        matchingSafeString(
            displayData.currentProfileName ||
            profile.name
        );

    const ownerMobile =
        matchingSafeString(
            profile.ownerMobile ||
            profile.mobile ||
            ""
        );

    const safeType =
        matchingEscapeJs(profileType);

    const safeId =
        matchingEscapeJs(profileId);

// ==========================================================
// WHY THIS MATCH
//
// PURPOSE:
// Show a short explanation of why this profile is ranked
// as a compatible match.
//
// IMPORTANT:
// - Uses existing matching/ranking data only.
// - No backend call.
// - No score recalculation.
// - No ranking changes.
// ==========================================================

function buildMatchingWhyThisMatch(
    profile
) {

    profile =
        profile || {};

    // ======================================================
    // SAFE VALUES
    // ======================================================

    const hardMatch =
        profile.hardMatch === true;

    const hardScoreNumber =
        Number(
            profile.hardScore
        );

    const hardScore =
        isNaN(hardScoreNumber)
            ? 0
            : hardScoreNumber;


    const expectationPercentageNumber =
        Number(
            profile.expectationCompatibilityPercentage
        );

    const expectationPercentage =
        isNaN(expectationPercentageNumber)
            ? 0
            : expectationPercentageNumber;


    const profilePercentageNumber =
        Number(
            profile.profileCompatibilityPercentage
        );

    const profilePercentage =
        isNaN(profilePercentageNumber)
            ? 0
            : profilePercentageNumber;


    // ======================================================
    // EXPECTATION APPLICABILITY
    //
    // IMPORTANT:
    // This must be determined BEFORE calculating the weighted
    // expectation contribution.
    // ======================================================

    const expectationApplicable =
        profile.expectationCompatibilityApplicable === true ||
        expectationPercentage > 0;


    // ======================================================
    // EXPLICIT SCORE VALUES
    // ======================================================

    const expectationScoreNumber =
        Number(
            profile.expectationScore
        );

    const profileScoreNumber =
        Number(
            profile.profileScore
        );


    // ======================================================
    // DERIVE WEIGHTED CONTRIBUTIONS WHEN EXPLICIT SCORE
    // FIELDS ARE NOT AVAILABLE
    //
    // Expectations = 30 points
    // Profile      = 20 points
    // ======================================================

    const calculatedExpectationScore =
        expectationApplicable &&
        !isNaN(expectationPercentageNumber)
            ? (
                expectationPercentageNumber *
                30 /
                100
              )
            : 0;


    const calculatedProfileScore =
        !isNaN(profilePercentageNumber)
            ? (
                profilePercentageNumber *
                20 /
                100
              )
            : 0;


    const expectationScore =
        !isNaN(expectationScoreNumber) &&
        expectationScoreNumber > 0
            ? expectationScoreNumber
            : calculatedExpectationScore;


    const profileScore =
        !isNaN(profileScoreNumber) &&
        profileScoreNumber > 0
            ? profileScoreNumber
            : calculatedProfileScore;


    // ======================================================
    // FINAL SCORE
    // ======================================================

    const finalScoreNumber =
        Number(
            profile.finalScore
        );

    const finalScore =
        isNaN(finalScoreNumber)
            ? 0
            : finalScoreNumber;


    // ======================================================
    // MATCHED EXPECTATIONS
    // ======================================================

    const matchedKeywords =
        Array.isArray(
            profile.matchedExpectationKeywords
        )
            ? profile.matchedExpectationKeywords
            : [];


    const keywordText =
        matchedKeywords.length > 0
            ? matchedKeywords
                .map(
                    function(keyword) {

                        return escapeHtml(
                            String(
                                keyword || ""
                            )
                        );

                    }
                )
                .join(", ")
            : "No specific expectation data";


    // ======================================================
    // HARD MATCH TEXT
    // ======================================================

    const hardMatchText =
        hardMatch
            ? "✓ Basic compatibility matched"
            : "✕ Basic compatibility not matched";


    // ======================================================
    // HTML
    // ======================================================

    return `
        <details class="matching-why-match">

            <summary class="matching-why-match-summary">
                🔎 Why this Match?
            </summary>


            <div class="matching-why-match-content">

                <div class="matching-why-match-title">
                    How this profile matches with you
                </div>


                <div class="matching-why-match-row">
                    <span>
                        🔴 Hard Match
                    </span>

                    <strong>
                        ${hardMatchText}
                        — ${hardScore.toFixed(0)}/50
                    </strong>
                </div>


                <div class="matching-why-match-row">
                    <span>
                        ⭐ Expectations
                    </span>

                    <strong>
                        ${expectationApplicable
                            ? expectationPercentage + "% — " +
                              expectationScore.toFixed(2) + "/30"
                            : "N/A"
                        }
                    </strong>
                </div>


                <div class="matching-why-match-row">
                    <span>
                        🧩 Profile
                    </span>

                    <strong>
                        ${profilePercentage}%
                        — ${profileScore.toFixed(2)}/20
                    </strong>
                </div>


                <div class="matching-why-match-keywords">

                    <span class="matching-why-match-label">
                        Matched Expectations:
                    </span>

                    <span>
                        ${keywordText}
                    </span>

                </div>


                <div class="matching-why-match-formula">

                    <span class="matching-why-match-label">
                        Compatibility Score:
                    </span>

                    <span>
                        ${hardScore.toFixed(2)}
                        +
                        ${expectationScore.toFixed(2)}
                        +
                        ${profileScore.toFixed(2)}
                        =
                        <strong>
                            ${finalScore.toFixed(2)}/100
                        </strong>
                    </span>

                </div>


                <div class="matching-why-match-note">

                    Score is based on Hard Match 50,
                    Expectations 30, and Profile Compatibility 20.

                </div>

            </div>

        </details>
    `;
}

        !isNaN(expectationPercentage)

// ==========================================================
// LOAD MATCHING REACTION STATES
//
// EXISTING BACKEND FUNCTIONS:
// - getLikedProfiles()
// - getDislikedProfiles()
//
// NO BACKEND CHANGE.
// ==========================================================

function loadMatchingReactionStates(
    profiles,
    rankingResult,
    preserveExistingState
) {

    // ------------------------------------------------------
    // RESET ONLY FOR INITIAL MATCHING LOAD
    // ------------------------------------------------------

    if (
        preserveExistingState !== true
    ) {

        matchingReactionState = {};

    }


    const safeProfiles =
        Array.isArray(
            profiles
        )
            ? profiles
            : [];


    if (
        safeProfiles.length === 0
    ) {

        renderMatchingProfilesInChat(
            safeProfiles,
            rankingResult,
            preserveExistingState === true
        );

        return;

    }


    // ======================================================
    // LOAD LIKES
    // ======================================================

    google.script.run

        .withSuccessHandler(
            function(likedResult) {

                if (
                    likedResult &&
                    likedResult.success === true &&
                    Array.isArray(
                        likedResult.profiles
                    )
                ) {

                    likedResult.profiles.forEach(
                        function(profile) {

                            if (!profile) {
                                return;
                            }


                            const type =
                                profile.viewerProfileType ||
                                profile.type ||
                                "";


                            const id =
                                profile.viewerProfileId ||
                                profile.id ||
                                "";


                            if (
                                !type ||
                                !id
                            ) {

                                return;

                            }


                            const key =
                                getMatchingReactionKey(
                                    type,
                                    id
                                );


                            matchingReactionState[
                                key
                            ] = "LIKE";

                        }
                    );

                }


                loadMatchingDislikedStates(
                    safeProfiles,
                    rankingResult
                );

            }
        )


        .withFailureHandler(
            function(error) {

                console.warn(
                    "Matching liked state load failed:",
                    error
                );


                // Continue anyway.
                loadMatchingDislikedStates(
                    safeProfiles,
                    rankingResult
                );

            }
        )


        .getLikedProfiles(
            profileUserMobile
        );

}


// ==========================================================
// LOAD MATCHING DISLIKES
// ==========================================================

function loadMatchingDislikedStates(
    profiles,
    rankingResult,
    preserveExistingState
) {

    google.script.run

        .withSuccessHandler(
            function(dislikedResult) {

                if (
                    dislikedResult &&
                    dislikedResult.success === true &&
                    Array.isArray(
                        dislikedResult.profiles
                    )
                ) {

                    dislikedResult.profiles.forEach(
                        function(profile) {

                            if (!profile) {
                                return;
                            }


                            const type =
                                profile.viewerProfileType ||
                                profile.type ||
                                "";


                            const id =
                                profile.viewerProfileId ||
                                profile.id ||
                                "";


                            if (
                                !type ||
                                !id
                            ) {

                                return;

                            }


                            const key =
                                getMatchingReactionKey(
                                    type,
                                    id
                                );


                            matchingReactionState[
                                key
                            ] = "DISLIKE";

                        }
                    );

                }


                loadMatchingRelationshipStates(
                    profiles,
                    rankingResult,
                    preserveExistingState
                );

            }
        )


        .withFailureHandler(
            function(error) {

                console.warn(
                    "Matching disliked state load failed:",
                    error
                );


                // Reaction-state failure must NOT
                // prevent Matching Profiles from opening.

                loadMatchingRelationshipStates(
                    profiles,
                    rankingResult,
                    preserveExistingState
                );

            }
        )


        .getDislikedProfiles(
            profileUserMobile
        );

}


// ==========================================================
// LOAD MATCHING RELATIONSHIP STATES
//
// Purpose:
// - Load the real relationship status for each Matching Profile.
// - Show "❤️ Matched" immediately when both users have LIKED.
// - Keep existing Like / Dislike state loading unchanged.
// ==========================================================

function loadMatchingRelationshipStates(
    profiles,
    rankingResult,
    preserveExistingState
) {

    const safeProfiles =
        Array.isArray(profiles)
            ? profiles
            : [];

    const viewerMobile =
        matchingSafeString(
            typeof profileUserMobile !== "undefined"
                ? profileUserMobile
                : ""
        );

    if (
        safeProfiles.length === 0 ||
        !viewerMobile
    ) {

        matchingProfilesReady = true;

        console.log(
            "MATCHING PROFILE DATA READY."
        );

        tryRenderMatchingProfilesWhenReady(
            safeProfiles,
            rankingResult,
            preserveExistingState === true
        );

        return;

    }


    let pendingRequests = 0;
    let rendered = false;


    function renderWhenComplete() {

        if (
            rendered ||
            pendingRequests > 0
        ) {
            return;
        }


        rendered = true;


        // ------------------------------------------------------
        // PROFILE DATA + RELATIONSHIP STATES READY
        // ------------------------------------------------------

        matchingProfilesReady = true;

        console.log(
            "MATCHING PROFILE DATA READY."
        );


        // ------------------------------------------------------
        // WAIT FOR TYPEWRITER IF NECESSARY
        // ------------------------------------------------------

        tryRenderMatchingProfilesWhenReady(
            safeProfiles,
            rankingResult,
            preserveExistingState === true
        );

    }


    safeProfiles.forEach(
        function(profile) {

            if (!profile) {
                return;
            }

            const targetMobile =
                matchingSafeString(
                    profile.ownerMobile ||
                    profile.mobile ||
                    ""
                );

            if (!targetMobile) {
                return;
            }

            pendingRequests++;


            google.script.run

                .withSuccessHandler(
                    function(relationship) {

                        profile.relationship =
                            relationship || null;

                        pendingRequests--;

                        renderWhenComplete();

                    }
                )

                .withFailureHandler(
                    function(error) {

                        console.warn(
                            "Matching relationship load failed:",
                            {
                                targetMobile,
                                error
                            }
                        );

                        profile.relationship = null;

                        pendingRequests--;

                        renderWhenComplete();

                    }
                )

                .getRelationshipStatus(
                    viewerMobile,
                    targetMobile
                );

        }
    );


    renderWhenComplete();

}

function buildMatchingReactionButtons(
    profile,
    currentReaction,
    relationship
) {

    profile = profile || {};

    currentReaction =
        String(currentReaction || "")
            .trim()
            .toUpperCase();

    relationship =
        relationship ||
        profile.relationship ||
        profile.relationshipStatus ||
        null;


    const displayData =
        prepareProfileDisplayData(
            profile,
            profile.type || ""
        );

    const profileType =
        matchingSafeString(
            displayData.currentProfileType ||
            profile.type
        ).toLowerCase();

    const profileId =
        matchingSafeString(
            displayData.currentProfileId ||
            profile.id
        );

    const profileName =
        matchingSafeString(
            displayData.currentProfileName ||
            profile.name
        );

    const ownerMobile =
        matchingSafeString(
            profile.ownerMobile ||
            profile.mobile ||
            ""
        );

    const safeType =
        matchingEscapeJs(profileType);

    const safeId =
        matchingEscapeJs(profileId);

    const safeName =
        matchingEscapeJs(profileName);

    const safeOwnerMobile =
        matchingEscapeJs(ownerMobile);


    const isMutual =
        relationship &&
        (
            relationship.status === "MUTUAL_LIKE" ||
            relationship.isMutual === true
        );


    let likeButton = "";
    let dislikeButton = "";


    // ======================================================
    // LIKE
    // ======================================================

    if (isMutual) {

        likeButton = `

            <button
                type="button"
                class="profile-reaction-btn mutual"
                disabled
            >

                ❤️ Matched

            </button>

        `;

    }
    else if (currentReaction === "LIKE") {

        likeButton = `

            <button
                type="button"
                class="profile-reaction-btn liked-active"
                disabled
            >

                ❤️ Liked

            </button>

        `;

    }
    else {

        likeButton = `

            <button
                type="button"
                class="profile-reaction-btn"
                onclick="
                    reactToMatchingProfile(
                        '${safeType}',
                        '${safeId}',
                        '${safeName}',
                        '${safeOwnerMobile}',
                        'LIKE',
                        this
                    )
                "
            >

                ❤️ Like

            </button>

        `;

    }


    // ======================================================
    // DISLIKE
    // ======================================================

    if (currentReaction === "DISLIKE") {

        dislikeButton = `

            <button
                type="button"
                class="profile-reaction-btn disliked-active"
                disabled
            >

                👎 Disliked

            </button>

        `;

    }
    else {

        dislikeButton = `

            <button
                type="button"
                class="profile-reaction-btn"
                onclick="
                    reactToMatchingProfile(
                        '${safeType}',
                        '${safeId}',
                        '${safeName}',
                        '${safeOwnerMobile}',
                        'DISLIKE',
                        this
                    )
                "
            >

                👎 Dislike

            </button>

        `;

    }


    return `

        <div
            class="matching-reaction-actions"
            data-matching-reaction="${safeType}_${safeId}"
        >

            ${likeButton}

            ${dislikeButton}

        </div>

    `;

}

//
// IMPORTANT:
// Existing backend function remains untouched.
//
// This wrapper:
// 1. Calls EXISTING reactToProfile()
// 2. Keeps Matching state separately.
// 3. Prevents existing Search UI from being modified.
// ==========================================================

function reactToMatchingProfile(
    type,
    profileId,
    profileName,
    ownerMobile,
    reaction,
    button
) {

    // ==========================================
    // NORMALIZE
    // ==========================================

    type =
        matchingSafeString(
            type
        )
        .toLowerCase();


    profileId =
        matchingSafeString(
            profileId
        );


    profileName =
        matchingSafeString(
            profileName
        );


    ownerMobile =
        matchingSafeString(
            ownerMobile
        );


    reaction =
        matchingSafeString(
            reaction
        )
        .toUpperCase();


    if (
        !type ||
        !profileId ||
        !reaction
    ) {

        console.warn(
            "Invalid matching reaction:",
            {
                type,
                profileId,
                reaction
            }
        );

        return;

    }


    // ==========================================
    // VERIFIED USER
    // ==========================================

    if (
        typeof profileAccessVerified ===
        "undefined" ||
        !profileAccessVerified
    ) {

        botMessage(`

            🔐 <b>Verification Required</b>

            <br><br>

            Profile Like किंवा Dislike करण्यासाठी
            प्रथम registered mobile number verify करा.

        `);

        return;

    }


    // ==========================================
    // PREVENT DOUBLE CLICK
    // ==========================================

    if (button) {

        button.disabled =
            true;

    }


    console.log(
        "MATCHING REACTION CLICKED:",
        {
            type,
            profileId,
            profileName,
            ownerMobile,
            reaction
        }
    );


    // ==========================================
    // SAVE USING EXISTING FUNCTION
    //
    // DO NOT CHANGE BACKEND
    // ==========================================

    reactToProfile(
        type,
        profileId,
        profileName,
        ownerMobile,
        reaction,
        button
    );


    // ==================================================
    // IMPORTANT
    //
    // reactToProfile() will handle the backend response.
    //
    // Matching UI is synchronized from reactToProfile()
    // after backend success.
    //
    // DO NOT update UI here because backend response
    // has not arrived yet.
    // ==================================================

}

// existing updateReactionButtons().
//
// Therefore Search Like / Dislike functionality is untouched.
// ==========================================================

function updateMatchingReactionUI(
    type,
    profileId,
    reaction,
    relationship
) {

    type =
        matchingSafeString(type)
            .toLowerCase();

    profileId =
        matchingSafeString(profileId);

    reaction =
        matchingSafeString(reaction)
            .toUpperCase();


    if (!type || !profileId || !reaction) {

        console.warn(
            "Invalid matching reaction UI data:",
            {
                type,
                profileId,
                reaction
            }
        );

        return;

    }


    const key =
        getMatchingReactionKey(
            type,
            profileId
        );


    matchingReactionState[key] =
        reaction;


    console.log(
        "MATCHING STATE SAVED:",
        {
            key,
            reaction
        }
    );


    const containers =
        document.querySelectorAll(
            `[data-matching-reaction="${key}"]`
        );


    if (!containers.length) {

        console.log(
            "Matching container not currently visible:",
            key
        );

        return;

    }


    const profile =
        Array.isArray(matchingRenderedProfiles)
            ? matchingRenderedProfiles.find(
                function(item) {

                    if (!item) {
                        return false;
                    }

                    const itemType =
                        matchingSafeString(
                            item.viewerProfileType ||
                            item.currentProfileType ||
                            item.profileType ||
                            item.type ||
                            ""
                        ).toLowerCase();

                    const itemId =
                        matchingSafeString(
                            item.viewerProfileId ||
                            item.currentProfileId ||
                            item.profileId ||
                            item.id ||
                            ""
                        );

                    return (
                        itemType === type &&
                        itemId === profileId
                    );

                }
            )
            : null;


    if (!profile) {

        console.warn(
            "Matching profile object not found:",
            {
                type,
                profileId,
                key
            }
        );

        return;

    }


    /*
     * Keep the latest relationship on the profile.
     * If the existing reactToProfile() flow supplies
     * relationship, it will be used immediately.
     */
    if (relationship) {

        profile.relationship =
            relationship;

    }


    const effectiveRelationship =
        relationship ||
        profile.relationship ||
        profile.relationshipStatus ||
        null;


    const html =
        buildMatchingReactionButtons(
            profile,
            reaction,
            effectiveRelationship
        );


    containers.forEach(
        function(container) {

            container.outerHTML =
                html;

        }
    );


    console.log(
        "MATCHING REACTION UI UPDATED:",
        {
            key,
            reaction,
            relationship:
                effectiveRelationship,
            containersUpdated:
                containers.length
        }
    );

}



// ==========================================================
// BACK TO MATCHING PROFILES
// ==========================================================

function backToMatchingProfiles() {

    console.log(
        "BACK TO MATCHING PROFILES"
    );


    if (
        !Array.isArray(
            matchingRenderedProfiles
        ) ||
        matchingRenderedProfiles.length ===
        0
    ) {

        console.warn(
            "No matching profiles stored locally."
        );

        return;

    }


    showMatchingChatHeader(
        matchingLastRankingResult,
        matchingRenderedProfiles.length
    );


    matchingRenderedProfiles.forEach(
        function(
            profile,
            index
        ) {

            const cardHtml =
                buildMatchingProfileCard(
                    profile,
                    index
                );


            if (
                cardHtml
            ) {

                botMessage(
                    cardHtml
                );

            }

        }
    );


    scrollChat();

}

// ==========================================================
// MATCHING PROFILE CHECK
// ==========================================================

function isMatchingProfileCard(
    type,
    profileId
) {

    type =
        matchingSafeString(
            type
        )
        .toLowerCase();


    profileId =
        matchingSafeString(
            profileId
        );


    if (
        !type ||
        !profileId
    ) {

        return false;

    }


    // ==========================================
    // MATCHING REACTION KEY
    // ==========================================

    const key =
        getMatchingReactionKey(
            type,
            profileId
        );


    // ==========================================
    // FIND MATCHING CONTAINER
    // ==========================================

    const container =
        document.querySelector(
            `[data-matching-reaction="${key}"]`
        );


    if (!container) {

        return false;

    }


    // ==========================================
    // CHECK WHETHER MATCHING CARD IS ACTUALLY
    // VISIBLE ON SCREEN
    //
    // Important:
    // Search ↔ Matching navigation may leave
    // old Matching DOM in the document.
    //
    // We must NOT treat hidden Matching DOM
    // as an active Matching profile.
    // ==========================================

    const style =
        window.getComputedStyle(
            container
        );


    const isVisible =
        (
            style.display !== "none" &&
            style.visibility !== "hidden" &&
            parseFloat(
                style.opacity || "1"
            ) !== 0 &&
            container.getClientRects().length > 0
        );


    return isVisible;

}


// ==========================================================
// IMPORTANT BRIDGE
//
// Existing reactToProfile() calls
// updateReactionButtons() after backend success.
//
// We do NOT modify that existing function here.
//
// Therefore this helper can be called manually from
// the existing reaction flow if needed.
//
// This function is also safe to call independently.
// ==========================================================

function handleMatchingReactionSuccess(
    type,
    profileId,
    reaction,
    relationship
) {

    updateMatchingReactionUI(
        type,
        profileId,
        reaction,
        relationship
    );

}
