<style>

  border-radius: 12px;

  padding: 14px;

  margin-top: 10px;

}


.profile-card-title {

  font-size: 35px;

  font-weight: 600;

  margin-bottom: 7px;

  opacity: 0.75;

}


.profile-name {

  font-size: 35px;

  font-weight: 700;

  margin-bottom: 10px;

}


.profile-details {

}


.profile-details div {

  margin-bottom: 3px;

}

/* ==========================================

========================================== */

.profile-detail-row {

    gap: 8px;

    line-height: 1.7;

    flex-wrap: wrap;

}

.profile-detail-label {

    font-weight: 600;

    white-space: nowrap;

}

.profile-detail-value {

    flex: 1;

}

========================================= */

.profile-photo-container {

  width: 100%;

  max-width: 220px;

  overflow: hidden;

  border: 1px solid #e5e7eb;

  background: #f8f9fa;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* =========================================

========================================= */

.profile-photo {

  width: 100%;

  height: 100%;

}

.profile-photo-placeholder {

  height: 100%;

  justify-content: center;

  background: #f3f4f6;

}

   SELECTED SEARCH FILTERS
========================================= */

.selected-filters {

  margin: 8px 0 12px 0;

}

========================================= */

}


.view-profile-btn {

  width: 100%;

  padding: 25px;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  font-weight: 600;

}

========================================= */

.full-profile-card {
  width: 100%;
