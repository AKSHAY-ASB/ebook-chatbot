<script>

/* =====================================================
   AUTH UI STATE
===================================================== */

let authUIState =
  "LOGIN_REQUIRED";

let authUIRequestId =
  "";

let authUISessionId =
  "";

let authUIMobile =
  "";

let authUIUser =
  null;

/* =====================================================
   PERSISTENT AUTH SESSION
===================================================== */

const AUTH_SESSION_STORAGE_KEY =
  "DEVANG_PUSTIKA_AUTH_SESSION";

let authSessionExpiryTimer = null;  

let authUITimer =
  null;

let authUISeconds =
  0;


/* =====================================================
   HELPERS
===================================================== */

function authShowScreen(
  screen
) {

  const screens = [

    "authLoginScreen",

    "authOTPScreen",

    "authSuccessScreen"

  ];


  screens.forEach(
    function(id) {

      const element =
        document.getElementById(id);


      if (!element) {
        return;
      }


      element.style.display =
        id === screen
          ? "flex"
          : "none";

    }
  );

}


function authShowError(
  elementId,
  message
) {

  const element =
    document.getElementById(
      elementId
    );


  if (!element) {
    return;
  }


  element.textContent =
    message || "";


  element.style.display =
    message
      ? "block"
      : "none";

}


function authSetLoading(
  type,
  loading
) {

  const button =
    document.getElementById(
      type === "login"
        ? "authSendOTPButton"
        : "authVerifyOTPButton"
    );


  const loader =
    document.getElementById(
      type === "login"
        ? "authLoginLoader"
        : "authOTPLoader"
    );


  if (button) {

    button.disabled =
      loading;

  }


  if (loader) {

    loader.style.display =
      loading
        ? "block"
        : "none";

  }

}


/* =====================================================
   MOBILE VALIDATION
===================================================== */

function authNormalizeMobile(
  value
) {

  let mobile =
    String(
      value || ""
    )
      .replace(/\D/g, "");


  if (
    mobile.length === 12 &&
    mobile.startsWith("91")
  ) {

    mobile =
      mobile.substring(2);

  }


  return mobile;

}


function authIsValidMobile(
  mobile
) {

  return /^[6-9]\d{9}$/
    .test(mobile);

}


function authMaskMobile(
  mobile
) {

  if (
    !mobile ||
    mobile.length !== 10
  ) {

    return "+91 XXXXX XXXXX";

  }


  return (
    "+91 " +
    mobile.substring(0, 2) +
    "XXXXXX" +
    mobile.substring(8)
  );

}


/* =====================================================
   REQUEST OTP
===================================================== */

function authRequestOTP() {

  const input =
    document.getElementById(
      "authMobile"
    );


  const mobile =
    authNormalizeMobile(
      input
        ? input.value
        : ""
    );


  authShowError(
    "authLoginError",
    ""
  );


  if (
    !authIsValidMobile(
      mobile
    )
  ) {

    authShowError(
      "authLoginError",
      "कृपया योग्य 10 अंकी registered mobile number टाका."
    );

    return;

  }


  authUIMobile =
    mobile;


  // =================================================
  // GET TRUSTED AUTH TOKEN
  // =================================================

  const trustedToken =
    localStorage.getItem(
      "DEVANG_PUSTIKA_TRUSTED_TOKEN"
    ) || "";


  console.log(
    "Trusted token available:",
    !!trustedToken
  );


  authSetLoading(
    "login",
    true
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        authSetLoading(
          "login",
          false
        );


        console.log(
          "requestLoginOTP result:",
          result
        );


        // =============================================
        // GENERAL ERROR
        // =============================================

        if (
          !result ||
          result.success !== true
        ) {

          authShowError(
            "authLoginError",
            result &&
            result.message
              ? result.message
              : "OTP request failed."
          );

          return;

        }


        // =============================================
        // TRUSTED AUTH LOGIN
        // =============================================
        //
        // Trusted user:
        //
        // authenticated = true
        // trusted = true
        // otpRequired = false
        //
        // Therefore DO NOT show OTP screen.
        // =============================================

        if (
          result.authenticated === true &&
          result.trusted === true &&
          result.otpRequired === false &&
          result.authenticationMethod ===
            "TRUSTED_AUTH"
        ) {

          console.log(
            "✅ TRUSTED AUTH LOGIN SUCCESS"
          );


          authUIState =
            "SESSION_ACTIVE";


          authUISessionId =
            result.sessionId;


          authUIUser =
            result.user || null;


          // Stop any OTP timer
          authStopResendTimer();


          // =========================================
          // DIRECTLY OPEN CHATBOT
          // =========================================

          authContinueToChatbot();


          return;

        }


        // =============================================
        // NORMAL OTP LOGIN
        // =============================================

        if (
          result.otpRequired === true
        ) {

          authUIRequestId =
            result.requestId;


          authUIState =
            "OTP_PENDING";


          const masked =
            document.getElementById(
              "authMaskedMobile"
            );


          if (masked) {

            masked.textContent =
              authMaskMobile(
                authUIMobile
              );

          }


          authShowScreen(
            "authOTPScreen"
          );


          authStartResendTimer(
            result.retryAfter ||
            60
          );


          authFocusFirstOTP();


          return;

        }


        // =============================================
        // UNEXPECTED RESPONSE
        // =============================================

        console.error(
          "Unexpected login response:",
          result
        );


        authShowError(
          "authLoginError",
          "Authentication response invalid आहे."
        );

      }
    )


    .withFailureHandler(
      function(error) {

        authSetLoading(
          "login",
          false
        );


        console.error(
          "requestLoginOTP error:",
          error
        );


        authShowError(
          "authLoginError",
          "OTP request करताना समस्या आली."
        );

      }
    )


    // ===============================================
    // BACKEND CALL
    // ===============================================

    .requestLoginOTP(
      mobile,
      trustedToken
    );

}


/* =====================================================
   OTP INPUT
===================================================== */

function authGetOTP() {

  const inputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  let otp = "";


  inputs.forEach(
    function(input) {

      otp +=
        String(
          input.value || ""
        )
        .replace(/\D/g, "");

    }
  );


  return otp;

}


function authClearOTP() {

  const inputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  inputs.forEach(
    function(input) {

      input.value =
        "";

    }
  );


  authFocusFirstOTP();

}


function authFocusFirstOTP() {

  const first =
    document.querySelector(
      ".auth-otp-input"
    );


  if (first) {

    first.focus();

  }

}


/* =====================================================
   VERIFY OTP
===================================================== */

function authVerifyOTP() {

  const otp =
    authGetOTP();


  authShowError(
    "authOTPError",
    ""
  );


  if (
    !/^\d{6}$/.test(
      otp
    )
  ) {

    authShowError(
      "authOTPError",
      "कृपया 6 अंकी OTP टाका."
    );

    return;

  }


  if (
    !authUIRequestId
  ) {

    authShowError(
      "authOTPError",
      "OTP request session सापडली नाही."
    );

    return;

  }


  authSetLoading(
    "otp",
    true
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        authSetLoading(
          "otp",
          false
        );


        if (
          !result ||
          result.success !== true ||
          result.verified !== true
        ) {

          authShowError(
            "authOTPError",
            result &&
            result.message
              ? result.message
              : "Invalid OTP."
          );

          authClearOTP();

          return;

        }


        authUIState =
          "SESSION_ACTIVE";


        authUISessionId =
          result.sessionId;


        authUIUser =
          result.user ||
          null;


        // ==========================================
        // SAVE TRUSTED AUTH TOKEN
        // ==========================================

        if (
          result.trusted === true &&
          result.trustedToken
        ) {

          localStorage.setItem(
            "DEVANG_PUSTIKA_TRUSTED_TOKEN",
            result.trustedToken
          );

          console.log(
            "✅ Trusted token saved."
          );

        }
        // ==========================================
        // SAVE SESSION FOR PAGE REFRESH
        // ==========================================

        authSaveSession();


        // ==========================================
        // START SESSION EXPIRY TIMER
        // ==========================================

        if (result.expiresAt) {

          authStartSessionExpiryTimer(
            result.expiresAt
          );

        }
        else if (result.expiresIn) {

          authStartSessionExpiryTimer(
            new Date(
              Date.now() +
              (
                Number(
                  result.expiresIn
                ) * 1000
              )
            ).toISOString()
          );

        }  


        authStopResendTimer();


        const name =
          document.getElementById(
            "authUserName"
          );


        if (name) {

          name.textContent =
            authUIUser &&
            authUIUser.name
              ? authUIUser.name
              : "User";

        }


        authShowScreen(
          "authSuccessScreen"
        );

      }
    )

    .withFailureHandler(
      function(error) {

        authSetLoading(
          "otp",
          false
        );


        console.error(
          "verifyLoginOTP error:",
          error
        );


        authShowError(
          "authOTPError",
          "OTP verification करताना समस्या आली."
        );

      }
    )

    .verifyLoginOTP(

      authUIRequestId,

      otp

    );

}


/* =====================================================
   RESEND TIMER
===================================================== */

function authStartResendTimer(
  seconds
) {

  authStopResendTimer();


  authUISeconds =
    Number(
      seconds
    ) || 60;


  const button =
    document.getElementById(
      "authResendButton"
    );


  if (button) {

    button.disabled =
      true;

  }


  authUpdateResendTimer();


  authUITimer =
    setInterval(
      function() {

        authUISeconds--;


        authUpdateResendTimer();


        if (
          authUISeconds <= 0
        ) {

          authStopResendTimer();

        }

      },
      1000
    );

}


function authUpdateResendTimer() {

  const timer =
    document.getElementById(
      "authResendTimer"
    );


  const button =
    document.getElementById(
      "authResendButton"
    );


  if (!timer) {
    return;
  }


  if (
    authUISeconds > 0
  ) {

    timer.textContent =
      "Resend OTP in " +
      authUISeconds +
      " seconds";


    if (button) {

      button.disabled =
        true;

    }

  }

  else {

    timer.textContent =
      "You can request a new OTP now.";


    if (button) {

      button.disabled =
        false;

    }

  }

}


function authStopResendTimer() {

  if (authUITimer) {

    clearInterval(
      authUITimer
    );

    authUITimer =
      null;

  }

}


/* =====================================================
   RESEND OTP
===================================================== */

function authResendOTP() {

  authShowError(
    "authOTPError",
    ""
  );


  if (!authUIMobile) {

    authShowError(
      "authOTPError",
      "मोबाईल नंबर उपलब्ध नाही."
    );

    return;

  }


  authSetLoading(
    "resend",
    true
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        authSetLoading(
          "resend",
          false
        );


        console.log(
          "resendLoginOTP result:",
          result
        );


        if (
          !result ||
          result.success !== true
        ) {

          authShowError(
            "authOTPError",
            result &&
            result.message
              ? result.message
              : "OTP पुन्हा पाठवता आला नाही."
          );

          return;

        }


        // ==========================================
        // IMPORTANT
        // New OTP request ID
        // ==========================================

        authUIRequestId =
          result.requestId;


        authUIState =
          "OTP_PENDING";


        // ==========================================
        // Restart timer
        // ==========================================

        authStartResendTimer(
          result.retryAfter ||
          60
        );


        authFocusFirstOTP();


        authShowError(
          "authOTPError",
          "नवीन OTP पाठवला आहे."
        );

      }
    )

    .withFailureHandler(
      function(error) {

        authSetLoading(
          "resend",
          false
        );


        console.error(
          "resendLoginOTP error:",
          error
        );


        authShowError(
          "authOTPError",
          "OTP पुन्हा पाठवताना समस्या आली."
        );

      }
    )

    .resendLoginOTP(
      authUIMobile
    );

}


/* =====================================================
   BACK TO LOGIN
===================================================== */

function authBackToLogin() {

  authStopResendTimer();


  authUIState =
    "LOGIN_REQUIRED";


  authUIRequestId =
    "";


  authUIMobile =
    "";


  authClearOTP();


  authShowError(
    "authOTPError",
    ""
  );


  authShowScreen(
    "authLoginScreen"
  );


  const mobile =
    document.getElementById(
      "authMobile"
    );


  if (mobile) {

    mobile.focus();

  }

}


/* =====================================================
   CONTINUE TO CHATBOT
===================================================== */

function authContinueToChatbot() {

  if (
    !authUISessionId ||
    authUIState !==
      "SESSION_ACTIVE"
  ) {

    console.error(
      "No active authenticated session."
    );

    return;

  }


  authSaveSession();


  authOpenChatbot();

}




/* =====================================================
   LOGOUT
===================================================== */

function authLogout() {

  // ==========================================
  // NO SESSION
  // ==========================================

  if (!authUISessionId) {

    authClearSession();

    authShowScreen(
      "authLoginScreen"
    );

    return;

  }


  const sessionId =
    authUISessionId;


  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "Logout:",
          result
        );


        authStopSessionExpiryTimer();

        authClearSession();


        authUIRequestId =
          "";

        authUIMobile =
          "";

        authUIState =
          "LOGIN_REQUIRED";


        // ======================================
        // HIDE CHATBOT
        // ======================================

        const chatbotWrapper =
          document.getElementById(
            "chatbotWrapper"
          );

        if (chatbotWrapper) {

          chatbotWrapper.style.display =
            "none";

        }


        // ======================================
        // SHOW LOGIN
        // ======================================

        const authContainer =
          document.getElementById(
            "authContainer"
          );

        if (authContainer) {

          authContainer.style.display =
            "flex";

        }


        authShowScreen(
          "authLoginScreen"
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "Logout error:",
          error
        );

        // Even if server already removed
        // the session, clear local session.

        authStopSessionExpiryTimer();

        authClearSession();

        authUIState =
          "LOGIN_REQUIRED";


        authShowScreen(
          "authLoginScreen"
        );

      }
    )

    .logoutAuthSession(
      sessionId
    );

}




/* =====================================================
   INITIAL STATE
===================================================== */

function initAuthUI() {

  authUIState =
    "LOGIN_REQUIRED";


  // ==========================================
  // RESTORE EXISTING SESSION FIRST
  // ==========================================

  authRestoreSession();


  // ==========================================
  // MOBILE INPUT
  // ==========================================

  const mobile =
    document.getElementById(
      "authMobile"
    );


  if (mobile) {

    mobile.addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .substring(0, 10);

      }
    );

  }


  // ==========================================
  // OTP INPUTS
  // ==========================================

  const otpInputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  otpInputs.forEach(
    function(input, index) {

      input.addEventListener(
        "input",
        function() {

          this.value =
            this.value
              .replace(/\D/g, "")
              .substring(0, 1);


          if (
            this.value &&
            index <
              otpInputs.length - 1
          ) {

            otpInputs[
              index + 1
            ].focus();

          }

        }
      );


      input.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
              "Backspace" &&
            !this.value &&
            index > 0
          ) {

            otpInputs[
              index - 1
            ].focus();

          }

        }
      );

    }
  );

}


initAuthUI();





/* =====================================================
   LOGIN BACKGROUND IMAGE
   Uses same Google Drive thumbnail method
   as profile photos
===================================================== */

function authConvertDriveImageUrl(url) {

    if (!url) {
        return "";
    }


    url =
        String(url)
            .trim();


    let fileId = "";


    // ==========================================
    // FORMAT 1
    // /file/d/FILE_ID/view
    // ==========================================

    let match =
        url.match(
            /\/file\/d\/([a-zA-Z0-9_-]+)/
        );


    if (
        match &&
        match[1]
    ) {

        fileId =
            match[1];

    }


    // ==========================================
    // FORMAT 2
    // ?id=FILE_ID
    // ==========================================

    if (!fileId) {

        match =
            url.match(
                /[?&]id=([a-zA-Z0-9_-]+)/
            );


        if (
            match &&
            match[1]
        ) {

            fileId =
                match[1];

        }

    }


    // ==========================================
    // GOOGLE DRIVE THUMBNAIL
    // ==========================================

    if (fileId) {

        return (
            "https://drive.google.com/thumbnail" +
            "?id=" +
            encodeURIComponent(fileId) +
            "&sz=w1600"
        );

    }


    // ==========================================
    // NORMAL IMAGE URL
    // ==========================================

    return url;

}


/* =====================================================
   LOAD LOGIN BACKGROUND
===================================================== */

function authLoadLoginBackground() {

    const originalUrl =
        "https://drive.google.com/file/d/1SFB9CClvrWwW1_FiE4rQLxXfrb9mqU6t/view";


    const imageUrl =
        authConvertDriveImageUrl(
            originalUrl
        );


    console.log(
        "Login background URL:",
        imageUrl
    );


    const image =
        document.getElementById(
            "loginBackgroundImage"
        );


    if (!image) {

        console.error(
            "❌ loginBackgroundImage not found."
        );

        return;

    }


    image.onload =
        function() {

            console.log(
                "✅ Login background loaded."
            );

        };


    image.onerror =
        function() {

            console.error(
                "❌ Login background failed to load."
            );

            console.error(
                "Image URL:",
                imageUrl
            );

        };


    image.src =
        imageUrl;

}


/* =====================================================
   SAVE SESSION
===================================================== */

function authSaveSession() {

  if (!authUISessionId) {
    return;
  }

  try {

    localStorage.setItem(
      AUTH_SESSION_STORAGE_KEY,
      authUISessionId
    );

    console.log(
      "✅ Auth session saved."
    );

  }
  catch (error) {

    console.error(
      "Session storage error:",
      error
    );

  }

}



/* =====================================================
   CLEAR SESSION
===================================================== */

function authClearSession() {

  try {

    localStorage.removeItem(
      AUTH_SESSION_STORAGE_KEY
    );

  }
  catch (error) {

    console.error(
      "Session clear error:",
      error
    );

  }

  authUISessionId = "";

  authUIUser = null;

}


/* =====================================================
   GET STORED SESSION
===================================================== */

function authGetStoredSession() {

  try {

    return (
      localStorage.getItem(
        AUTH_SESSION_STORAGE_KEY
      ) || ""
    );

  }
  catch (error) {

    console.error(
      "Session read error:",
      error
    );

    return "";

  }

}

/* =====================================================
   SESSION EXPIRY TIMER
===================================================== */

function authStartSessionExpiryTimer(
  expiresAt
) {

  authStopSessionExpiryTimer();


  if (!expiresAt) {
    return;
  }


  const expiryTime =
    new Date(
      expiresAt
    ).getTime();


  const remaining =
    expiryTime -
    Date.now();


  if (remaining <= 0) {

    authHandleSessionExpired();

    return;

  }


  console.log(
    "Session expires in:",
    Math.ceil(
      remaining / 1000
    ),
    "seconds"
  );


  authSessionExpiryTimer =
    setTimeout(
      function() {

        authHandleSessionExpired();

      },
      remaining
    );

}


function authStopSessionExpiryTimer() {

  if (
    authSessionExpiryTimer
  ) {

    clearTimeout(
      authSessionExpiryTimer
    );

    authSessionExpiryTimer =
      null;

  }

}


/* =====================================================
   HANDLE SESSION EXPIRY
===================================================== */

function authHandleSessionExpired() {

  console.warn(
    "🔒 Authentication session expired."
  );


  authStopSessionExpiryTimer();


  authClearSession();


  authUIState =
    "LOGIN_REQUIRED";

  authUIRequestId =
    "";

  authUIMobile =
    "";


  authShowScreen(
    "authLoginScreen"
  );


  const authContainer =
    document.getElementById(
      "authContainer"
    );


  const chatbotWrapper =
    document.getElementById(
      "chatbotWrapper"
    );


  if (authContainer) {

    authContainer.style.display =
      "flex";

  }


  if (chatbotWrapper) {

    chatbotWrapper.style.display =
      "none";

  }


  authShowError(
    "authLoginError",
    "तुमचे session expire झाले आहे. कृपया पुन्हा Login करा."
  );

}


/* =====================================================
   RESTORE EXISTING SESSION
===================================================== */

function authRestoreSession() {

  const storedSessionId =
    authGetStoredSession();


  // ==========================================
  // NO STORED SESSION
  // ==========================================

  if (!storedSessionId) {

    console.log(
      "No saved authentication session."
    );

    authShowScreen(
      "authLoginScreen"
    );

    const authContainer =
      document.getElementById(
        "authContainer"
      );

    if (authContainer) {
      authContainer.style.display =
        "flex";
    }

    return;

  }


  console.log(
    "🔄 Restoring existing session..."
  );


  // ==========================================
  // Temporarily hide auth UI
  // ==========================================

  const authContainer =
    document.getElementById(
      "authContainer"
    );

  if (authContainer) {

    authContainer.style.display =
      "none";

  }


  // ==========================================
  // SERVER VALIDATION
  // ==========================================

  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "SESSION RESTORE RESULT:",
          result
        );


        // ======================================
        // VALID SESSION
        // ======================================

        if (
          result &&
          result.success === true &&
          result.authenticated === true &&
          result.state ===
            "SESSION_ACTIVE"
        ) {

          authUISessionId =
            result.sessionId ||
            storedSessionId;


          authUIState =
            "SESSION_ACTIVE";


          authUIUser =
            result.user ||
            null;


          // ------------------------------------
          // Start expiry timer
          // ------------------------------------

          authStartSessionExpiryTimer(
            result.expiresAt
          );


          console.log(
            "✅ Existing session restored."
          );


          // ------------------------------------
          // Open chatbot directly
          // ------------------------------------

          authOpenChatbot();


          return;

        }


        // ======================================
        // INVALID / EXPIRED SESSION
        // ======================================

        console.warn(
          "Stored session invalid:",
          result &&
          result.code
        );


        authHandleSessionExpired();

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "Session restore failed:",
          error
        );


        // Fail closed
        authHandleSessionExpired();

      }
    )

    .validateAuthSession(
      storedSessionId
    );

}



/* =====================================================
   OPEN CHATBOT
===================================================== */

function authOpenChatbot() {

  if (
    !authUISessionId ||
    authUIState !==
      "SESSION_ACTIVE"
  ) {

    console.error(
      "Cannot open chatbot. Session inactive."
    );

    return;

  }


  const authContainer =
    document.getElementById(
      "authContainer"
    );

  if (authContainer) {

    authContainer.style.display =
      "none";

  }


  const chatbotWrapper =
    document.getElementById(
      "chatbotWrapper"
    );

  if (!chatbotWrapper) {

    console.error(
      "chatbotWrapper not found."
    );

    return;

  }


  chatbotWrapper.style.display =
    "block";


  if (
    typeof showMenu ===
    "function"
  ) {

    showMenu();

  }

}

/* =====================================================
   LOAD AFTER AUTH UI
===================================================== */

authLoadLoginBackground();


</script>
