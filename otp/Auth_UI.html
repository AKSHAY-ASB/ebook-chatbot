<script>

/* =====================================================
   AUTH UI STATE
===================================================== */

let authUIState =
  "LOGIN_REQUIRED";

let authUIRequestId =
  "";

let authUISessionId =
  "";

let authUIMobile =
  "";

let authUIUser =
  null;

let authUITimer =
  null;

let authUISeconds =
  0;


/* =====================================================
   HELPERS
===================================================== */

function authShowScreen(
  screen
) {

  const screens = [

    "authLoginScreen",

    "authOTPScreen",

    "authSuccessScreen"

  ];


  screens.forEach(
    function(id) {

      const element =
        document.getElementById(id);


      if (!element) {
        return;
      }


      element.style.display =
        id === screen
          ? "flex"
          : "none";

    }
  );

}


function authShowError(
  elementId,
  message
) {

  const element =
    document.getElementById(
      elementId
    );


  if (!element) {
    return;
  }


  element.textContent =
    message || "";


  element.style.display =
    message
      ? "block"
      : "none";

}


function authSetLoading(
  type,
  loading
) {

  const button =
    document.getElementById(
      type === "login"
        ? "authSendOTPButton"
        : "authVerifyOTPButton"
    );


  const loader =
    document.getElementById(
      type === "login"
        ? "authLoginLoader"
        : "authOTPLoader"
    );


  if (button) {

    button.disabled =
      loading;

  }


  if (loader) {

    loader.style.display =
      loading
        ? "block"
        : "none";

  }

}


/* =====================================================
   MOBILE VALIDATION
===================================================== */

function authNormalizeMobile(
  value
) {

  let mobile =
    String(
      value || ""
    )
      .replace(/\D/g, "");


  if (
    mobile.length === 12 &&
    mobile.startsWith("91")
  ) {

    mobile =
      mobile.substring(2);

  }


  return mobile;

}


function authIsValidMobile(
  mobile
) {

  return /^[6-9]\d{9}$/
    .test(mobile);

}


function authMaskMobile(
  mobile
) {

  if (
    !mobile ||
    mobile.length !== 10
  ) {

    return "+91 XXXXX XXXXX";

  }


  return (
    "+91 " +
    mobile.substring(0, 2) +
    "XXXXXX" +
    mobile.substring(8)
  );

}


/* =====================================================
   REQUEST OTP
===================================================== */

function authRequestOTP() {

  const input =
    document.getElementById(
      "authMobile"
    );


  const mobile =
    authNormalizeMobile(
      input
        ? input.value
        : ""
    );


  authShowError(
    "authLoginError",
    ""
  );


  if (
    !authIsValidMobile(
      mobile
    )
  ) {

    authShowError(
      "authLoginError",
      "कृपया योग्य 10 अंकी registered mobile number टाका."
    );

    return;

  }


  authUIMobile =
    mobile;


  authSetLoading(
    "login",
    true
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        authSetLoading(
          "login",
          false
        );


        if (
          !result ||
          result.success !== true
        ) {

          authShowError(
            "authLoginError",
            result &&
            result.message
              ? result.message
              : "OTP request failed."
          );

          return;

        }


        authUIRequestId =
          result.requestId;


        authUIState =
          "OTP_PENDING";


        const masked =
          document.getElementById(
            "authMaskedMobile"
          );


        if (masked) {

          masked.textContent =
            authMaskMobile(
              authUIMobile
            );

        }


        authShowScreen(
          "authOTPScreen"
        );


        authStartResendTimer(
          result.retryAfter ||
          60
        );


        authFocusFirstOTP();

      }
    )

    .withFailureHandler(
      function(error) {

        authSetLoading(
          "login",
          false
        );


        console.error(
          "requestLoginOTP error:",
          error
        );


        authShowError(
          "authLoginError",
          "OTP request करताना समस्या आली."
        );

      }
    )

    .requestLoginOTP(
      mobile
    );

}


/* =====================================================
   OTP INPUT
===================================================== */

function authGetOTP() {

  const inputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  let otp = "";


  inputs.forEach(
    function(input) {

      otp +=
        String(
          input.value || ""
        )
        .replace(/\D/g, "");

    }
  );


  return otp;

}


function authClearOTP() {

  const inputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  inputs.forEach(
    function(input) {

      input.value =
        "";

    }
  );


  authFocusFirstOTP();

}


function authFocusFirstOTP() {

  const first =
    document.querySelector(
      ".auth-otp-input"
    );


  if (first) {

    first.focus();

  }

}


/* =====================================================
   VERIFY OTP
===================================================== */

function authVerifyOTP() {

  const otp =
    authGetOTP();


  authShowError(
    "authOTPError",
    ""
  );


  if (
    !/^\d{6}$/.test(
      otp
    )
  ) {

    authShowError(
      "authOTPError",
      "कृपया 6 अंकी OTP टाका."
    );

    return;

  }


  if (
    !authUIRequestId
  ) {

    authShowError(
      "authOTPError",
      "OTP request session सापडली नाही."
    );

    return;

  }


  authSetLoading(
    "otp",
    true
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        authSetLoading(
          "otp",
          false
        );


        if (
          !result ||
          result.success !== true ||
          result.verified !== true
        ) {

          authShowError(
            "authOTPError",
            result &&
            result.message
              ? result.message
              : "Invalid OTP."
          );

          authClearOTP();

          return;

        }


        authUIState =
          "SESSION_ACTIVE";


        authUISessionId =
          result.sessionId;


        authUIUser =
          result.user ||
          null;


        authStopResendTimer();


        const name =
          document.getElementById(
            "authUserName"
          );


        if (name) {

          name.textContent =
            authUIUser &&
            authUIUser.name
              ? authUIUser.name
              : "User";

        }


        authShowScreen(
          "authSuccessScreen"
        );

      }
    )

    .withFailureHandler(
      function(error) {

        authSetLoading(
          "otp",
          false
        );


        console.error(
          "verifyLoginOTP error:",
          error
        );


        authShowError(
          "authOTPError",
          "OTP verification करताना समस्या आली."
        );

      }
    )

    .verifyLoginOTP(

      authUIRequestId,

      otp

    );

}


/* =====================================================
   RESEND TIMER
===================================================== */

function authStartResendTimer(
  seconds
) {

  authStopResendTimer();


  authUISeconds =
    Number(
      seconds
    ) || 60;


  const button =
    document.getElementById(
      "authResendButton"
    );


  if (button) {

    button.disabled =
      true;

  }


  authUpdateResendTimer();


  authUITimer =
    setInterval(
      function() {

        authUISeconds--;


        authUpdateResendTimer();


        if (
          authUISeconds <= 0
        ) {

          authStopResendTimer();

        }

      },
      1000
    );

}


function authUpdateResendTimer() {

  const timer =
    document.getElementById(
      "authResendTimer"
    );


  const button =
    document.getElementById(
      "authResendButton"
    );


  if (!timer) {
    return;
  }


  if (
    authUISeconds > 0
  ) {

    timer.textContent =
      "Resend OTP in " +
      authUISeconds +
      " seconds";


    if (button) {

      button.disabled =
        true;

    }

  }

  else {

    timer.textContent =
      "You can request a new OTP now.";


    if (button) {

      button.disabled =
        false;

    }

  }

}


function authStopResendTimer() {

  if (authUITimer) {

    clearInterval(
      authUITimer
    );

    authUITimer =
      null;

  }

}


/* =====================================================
   RESEND OTP
===================================================== */

function authResendOTP() {

  if (
    !authUIMobile
  ) {

    return;

  }


  authShowError(
    "authOTPError",
    ""
  );


  const button =
    document.getElementById(
      "authResendButton"
    );


  if (button) {

    button.disabled =
      true;

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          !result ||
          result.success !== true
        ) {

          authShowError(
            "authOTPError",
            result &&
            result.message
              ? result.message
              : "OTP resend failed."
          );


          if (button) {

            button.disabled =
              false;

          }


          return;

        }


        /*
         * IMPORTANT:
         *
         * The backend response must NOT
         * contain the OTP value.
         */

        authUIRequestId =
          result.requestId;


        authStartResendTimer(
          result.retryAfter ||
          60
        );


        authClearOTP();

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "Resend OTP error:",
          error
        );


        authShowError(
          "authOTPError",
          "OTP resend करताना समस्या आली."
        );


        if (button) {

          button.disabled =
            false;

        }

      }
    )

    /*
     * We will connect this to the
     * final backend resend API.
     */
    .resendLoginOTP(
      authUIMobile
    );

}


/* =====================================================
   BACK TO LOGIN
===================================================== */

function authBackToLogin() {

  authStopResendTimer();


  authUIState =
    "LOGIN_REQUIRED";


  authUIRequestId =
    "";


  authUIMobile =
    "";


  authClearOTP();


  authShowError(
    "authOTPError",
    ""
  );


  authShowScreen(
    "authLoginScreen"
  );


  const mobile =
    document.getElementById(
      "authMobile"
    );


  if (mobile) {

    mobile.focus();

  }

}


/* =====================================================
   CONTINUE TO CHATBOT
===================================================== */

function authContinueToChatbot() {

  console.log(
    "Authenticated session:",
    authUISessionId
  );


  // ==========================================
  // SECURITY CHECK
  // ==========================================

  if (
    !authUISessionId ||
    authUIState !== "SESSION_ACTIVE"
  ) {

    console.error(
      "No active authenticated session."
    );

    return;

  }


  // ==========================================
  // HIDE AUTH UI
  // ==========================================

  const authContainer =
    document.getElementById(
      "authContainer"
    );

  if (authContainer) {

    authContainer.style.display =
      "none";

  }


  // ==========================================
  // SHOW CHATBOT
  // ==========================================

  const chatbotWrapper =
    document.getElementById(
      "chatbotWrapper"
    );

  if (!chatbotWrapper) {

    console.error(
      "chatbotWrapper not found."
    );

    return;

  }


  chatbotWrapper.style.display =
    "block";


  // ==========================================
  // START CHATBOT
  // ==========================================

  if (
    typeof botMessage === "function"
  ) {

    botMessage(
      "👋 Welcome to Devang Pustika"
    );

    botMessage(
      "How can I help you today?"
    );

  }


  if (
    typeof showMenu === "function"
  ) {

    showMenu();

  }

}


/* =====================================================
   LOGOUT
===================================================== */

function authLogout() {

  if (
    !authUISessionId
  ) {

    authBackToLogin();

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "Logout:",
          result
        );


        authStopResendTimer();


        authUISessionId =
          "";


        authUIRequestId =
          "";


        authUIUser =
          null;


        authUIState =
          "LOGIN_REQUIRED";


        authShowScreen(
          "authLoginScreen"
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "Logout error:",
          error
        );

      }
    )

    .logoutLoginSession(
      authUISessionId
    );

}


/* =====================================================
   INITIAL STATE
===================================================== */

function initAuthUI() {

  authUIState =
    "LOGIN_REQUIRED";


  authShowScreen(
    "authLoginScreen"
  );


  const mobile =
    document.getElementById(
      "authMobile"
    );


  if (mobile) {

    mobile.addEventListener(
      "input",
      function() {

        this.value =
          this.value
            .replace(/\D/g, "")
            .substring(0, 10);

      }
    );

  }


  const otpInputs =
    document.querySelectorAll(
      ".auth-otp-input"
    );


  otpInputs.forEach(
    function(input, index) {

      input.addEventListener(
        "input",
        function() {

          this.value =
            this.value
              .replace(/\D/g, "")
              .substring(0, 1);


          if (
            this.value &&
            index <
              otpInputs.length - 1
          ) {

            otpInputs[
              index + 1
            ].focus();

          }

        }
      );


      input.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
              "Backspace" &&
            !this.value &&
            index > 0
          ) {

            otpInputs[
              index - 1
            ].focus();

          }

        }
      );

    }
  );

}


initAuthUI();

</script>
