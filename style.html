<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
background:#f2f4f8;

}

.chat-container{

width:420px;
height:650px;

margin:30px auto;

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.15);

display:flex;

flex-direction:column;

}

.header{

background:#0057B8;

color:white;

padding:18px;

font-size:22px;

font-weight:bold;

text-align:center;

}

#chat{

flex:1;

overflow-y:auto;

padding:15px;

background:#fafafa;

}

.bot{

background:#ECEFF1;

padding:12px;

border-radius:15px;

margin-bottom:10px;

width:80%;

}

.user{

margin-top:10px;

background:#0057B8;

color:white;

padding:12px;

border-radius:15px;

margin-bottom:10px;

margin-left:auto;

width:80%;

}

.bottom{

display:flex;

padding:10px;

border-top:1px solid #ddd;

}

.bottom input{

flex:1;

padding:12px;

font-size:16px;

border:1px solid #ccc;

border-radius:8px;

outline:none;

}

.bottom button{

margin-left:10px;

padding:12px 18px;

background:#0057B8;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

.menu{

display:flex;

flex-direction:column;

gap:8px;

margin-top:15px;

}

.menu button{

padding:12px;

border-radius:8px;

border:1px solid #0057B8;

background:white;

cursor:pointer;

font-size:15px;

}

.menu button:hover{

background:#0057B8;

color:white;

}

.chat-action-button {

  display: inline-block;

  background: #0057B8;

  color: white;

  text-decoration: none;

  padding: 10px 16px;

  border-radius: 8px;

  font-weight: 600;

  margin-top: 5px;

}


.chat-action-button:hover {

  opacity: 0.9;

}


.profile-filter-menu {

  margin-top: 10px;

}


.profile-card {

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  padding: 14px;

  margin-top: 5px;

}


.profile-card-title {

  font-size: 13px;

  font-weight: 600;

  margin-bottom: 7px;

  opacity: 0.75;

}


.profile-name {

  font-size: 17px;

  font-weight: 700;

  margin-bottom: 10px;

}


.profile-details {

  line-height: 1.7;

  font-size: 14px;

}


.profile-details div {

  margin-bottom: 3px;

}

/* =========================================
   PROFILE PHOTO CONTAINER
========================================= */

.profile-photo-container {

  width: 100%;

  max-width: 220px;

  height: 280px;

  margin: 0 auto 15px auto;

  border-radius: 12px;

  overflow: hidden;

  border: 1px solid #e5e7eb;

  background: #f8f9fa;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* =========================================
   ACTUAL PROFILE PHOTO
========================================= */

.profile-photo {

  width: 100%;

  height: 100%;

  object-fit: contain;

  object-position: center;

  display: block;

}


/* =========================================
   PLACEHOLDER - IF PHOTO NOT AVAILABLE
========================================= */

.profile-photo-placeholder {

  width: 100%;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 45px;

  background: #f3f4f6;

}

/* =========================================
   SELECTED SEARCH FILTERS
========================================= */

.selected-filters {

  background: #f8fafc;

  border: 1px solid #e2e8f0;

  border-radius: 10px;

  padding: 12px 14px;

  margin: 8px 0 12px 0;

}


.selected-filters-title {

  font-size: 15px;

  margin-bottom: 10px;

  padding-bottom: 7px;

  border-bottom: 1px solid #e2e8f0;

}


.selected-filter-row {

  font-size: 14px;

  line-height: 1.7;

}


.result-count {

  font-size: 14px;

  line-height: 1.6;

}

/* =========================================
   VIEW FULL PROFILE BUTTON
========================================= */

.profile-actions {

  margin-top: 15px;

  padding-top: 12px;

  border-top: 1px solid #e5e7eb;

}


.view-profile-btn {

  width: 100%;

  padding: 11px 15px;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  font-size: 14px;

  font-weight: 600;

}


.view-profile-btn:hover {

  opacity: 0.9;

}


.view-profile-btn:active {

  transform: scale(0.98);

}

/* =========================================
   FULL PROFILE
========================================= */

.full-profile-card {
  width: 100%;
  box-sizing: border-box;
}

.full-profile-title {
  font-size: 18px;
  margin-bottom: 15px;
  text-align: center;
}

.full-profile-photo {
  width: 100%;
  margin-bottom: 18px;
  display: flex;
  justify-content: center;
}

.full-profile-photo img {
  width: 100%;
  max-width: 350px;
  height: auto;
  max-height: 500px;
  object-fit: contain;
  border-radius: 10px;
  display: block;
}

.full-profile-section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}

.full-profile-section-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
}

.full-profile-row {
  margin-bottom: 9px;
  line-height: 1.5;
}

.full-profile-label {
  font-size: 13px;
  margin-bottom: 2px;
}

.full-profile-value {
  font-size: 14px;
  word-break: break-word;
}

/* =========================================
   PROFILE CONTACT CARD
========================================= */

.profile-contact-card {

  width: 100%;

  box-sizing: border-box;

}


.profile-contact-name {

  font-size: 16px;

  font-weight: 600;

  text-align: center;

  margin-bottom: 15px;

}


.profile-contact-card a {

  text-decoration: none;

  font-weight: 600;

}


/* =========================================
   PROFILE LIKE / DISLIKE
========================================= */

.profile-reaction-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.profile-reaction-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  background: #fff;
}

.profile-reaction-btn:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

/* =========================================
   LIKED PROFILES
========================================= */

.liked-profile-card {
  position: relative;
}

.liked-active {
  cursor: default;
  font-weight: 700;
}

.liked-active:disabled {
  opacity: 1;
}


/* =========================================
   DISLIKED PROFILES
========================================= */

.disliked-profile-card {
  position: relative;
}

.disliked-active {
  cursor: default;
  font-weight: 700;
}

.disliked-active:disabled {
  opacity: 1;
}

.profile-list-section {
  scroll-margin-top: 10px;
}

</style>
