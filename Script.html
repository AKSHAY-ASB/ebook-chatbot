<script>
  /* =========================================
   CHATBOT START
========================================= */
let chatbotState = "normal";
let profileSearchType = "";
let profileCurrentPage = 1;
let profileSearchDistrict = "";
let profileSearchPage = 1;
let profileSearchEducation = "";
let profileSearchIncome = "";

let profileAccessVerified = false;

let profileUserMobile = "";

let profileUserName = "";

let profileUserRegisteredSheet = "";

let pendingProfileSearchType = "";

let pendingProfileCategory = "";


window.onload = function () {

  botMessage(
    "👋 Welcome to Devang Pustika"
  );

  botMessage(
    "How can I help you today?"
  );

  showMenu();

};


/* =========================================
   ENTER KEY
========================================= */

function handleKey(e) {

  if (e.key === "Enter") {

    sendMessage();

  }

}


/* =========================================
   SEND USER MESSAGE
========================================= */


function sendMessage() {

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();


  if (text === "") {
    return;
  }


  // Show user's message
  userMessage(text);

  input.value = "";


  /*
   * ===================================
   * E-BOOK MOBILE VERIFICATION
   * ===================================
   */

  if (
    chatbotState ===
    "waiting_for_ebook_mobile"
  ) {

    verifyEbookMobile(text);

    return;
  }


  /*
   * ===================================
   * PROFILE SEARCH MOBILE VERIFICATION
   * ===================================
   */

if (
  chatbotState ===
  "profile_mobile_verification"
) {

  // Remove spaces, +91, hyphens, etc.
  let mobile =
    text.replace(/\D/g, "");


  // Handle 91XXXXXXXXXX
  if (
    mobile.length === 12 &&
    mobile.startsWith("91")
  ) {

    mobile =
      mobile.substring(2);
  }


  // ==========================================
  // INVALID MOBILE INPUT
  // ==========================================

  if (
    !/^[6-9]\d{9}$/.test(mobile)
  ) {

    botMessage(`

      ⚠️ <b>Invalid Mobile Number</b>

      <br><br>

      कृपया नोंदणी करताना दिलेला
      <b>10 अंकी मोबाईल नंबर</b> टाका.

      <br><br>

      उदाहरण: <b>9876543210</b>

    `);

    return;
  }


  // ==========================================
  // VALID MOBILE FORMAT
  // ==========================================

  verifyProfileMobile(mobile);

  return;
}


  /*
   * ===================================
   * NORMAL FAQ / AI CHAT
   * ===================================
   */

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        if (
          result &&
          result.found
        ) {

          botMessage(
            result.answer
          );


          if (
            result.action &&
            result.action !== "none"
          ) {

            handleAction(
              result.action
            );

          }

        }

          else {

                const invalidMessageId =
              "invalid-chat-message-" +
              Date.now();


            botMessage(`

              <div id="${invalidMessageId}">

                👋 <b>Welcome to Devang Pustika</b>

                <br><br>

                माफ करा, तुमचा प्रश्न मला समजला नाही.

                <br><br>

                मी तुम्हाला खालील पर्यायांमध्ये मदत करू शकतो.

                <br><br>

                कृपया एक पर्याय निवडा.

              </div>

            `);


            // Show main chatbot menu again
            showMenu();


            // Scroll specifically to invalid message
            setTimeout(
              function() {

                scrollToChatSection(
                  invalidMessageId
                );

              },
              100
            );


            // Show main chatbot menu again
            showMenu();

          }

      }
    )

    .withFailureHandler(
      function(error) {

        hideTyping();

        console.error(error);

        botMessage(
          "⚠️ Something went wrong. Please try again."
        );

      }
    )

    .askBot(text);

}


/* =========================================
   BOT MESSAGE
========================================= */

function botMessage(message) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `

    <div class="bot">

      ${message}

    </div>

  `;

  scrollChat();

}

function getSelectedFiltersHtml() {

  // ==========================================
  // PROFILE TYPE
  // ==========================================

  let typeLabel = "👤 Other";

  if (profileSearchType === "bride") {
    typeLabel = "👰 Bride";
  }

  else if (profileSearchType === "groom") {
    typeLabel = "🤵 Groom";
  }


  // ==========================================
  // DISTRICT
  // ==========================================

  let districtLabel =
    profileSearchDistrict === "all"
      ? "सर्व जिल्हे"
      : profileSearchDistrict;


  // ==========================================
  // EDUCATION
  // ==========================================

  const educationLabels = {

    Engineering:
      "Engineering & Technology",

    Medical:
      "Medical & Healthcare",

    Commerce:
      "Commerce & Management",

    Arts:
      "Arts & Humanities",

    Science:
      "Science & Agriculture",

    Diploma:
      "Diploma / ITI / Technical",

    Law:
      "Law / Architecture / Design",

    General:
      "General Education",

    all:
      "कोणतेही शिक्षण"

  };


  const educationLabel =
    educationLabels[profileSearchEducation] ||
    profileSearchEducation ||
    "कोणतेही शिक्षण";


  // ==========================================
  // INCOME
  // ==========================================

  let incomeLabel = "कोणतेही उत्पन्न";


  if (
    profileSearchIncome &&
    profileSearchIncome !== "all"
  ) {

    incomeLabel =
      profileSearchIncome
        .replace("मासिक उत्पन्न", "")
        .replace("रु.", "₹")
        .trim();

  }


  // ==========================================
  // RETURN FILTER BOX
  // ==========================================

  return `

    <div class="selected-filters">

      <div class="selected-filters-title">
        🔎 <b>Selected Filters</b>
      </div>

      <div class="selected-filter-row">
        <b>Profile:</b>
        ${typeLabel}
      </div>

      <div class="selected-filter-row">
        <b>📍 District:</b>
        ${escapeHtml(districtLabel)}
      </div>

      <div class="selected-filter-row">
        <b>🎓 Education:</b>
        ${escapeHtml(educationLabel)}
      </div>

      <div class="selected-filter-row">
        <b>💰 Monthly Income:</b>
        ${escapeHtml(incomeLabel)}
      </div>

    </div>

  `;

}
/* =========================================
   USER MESSAGE
========================================= */

function loadVerifiedEbook() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function (data) {

        hideTyping();


        if (
          !data ||
          !data.ebook
        ) {

          botMessage(

            "⚠️ E-book is currently unavailable."

          );

          return;

        }


        const ebook =
          data.ebook;


        botMessage(`

          📘 <b>${ebook.title}</b>

          <br><br>

          Your registration has been verified.

          <br><br>

          <a
            class="chat-action-button"
            href="${ebook.url}"
            target="_blank"
            rel="noopener noreferrer">

            📘 Access E-book

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);


        botMessage(

          "⚠️ Unable to load the E-book."

        );

      }
    )

    .getChatLinks();

}

function showRegistrationButton() {

            target="_blank"
            rel="noopener noreferrer">

            📝 Register Your Name

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);

      }
    )

    .getChatLinks();

}

function verifyEbookMobile(mobile) {

  // Remove spaces from beginning/end
  mobile = mobile.trim();

  if (mobile === "") {

    botMessage(
      "⚠️ Please enter your registered mobile number."
    );

    return;
  }


  // Show typing while checking Google Sheet
  showTyping();


  google.script.run

    .withSuccessHandler(function(result) {

      hideTyping();

      console.log("Verification Result:", result);


      // No response received
      if (!result) {

        botMessage(
          "⚠️ No response received from the verification system."
        );

        return;
      }


      // ==========================================
      // REGISTERED USER
      // ==========================================

      if (
        result.success === true &&
        result.verified === true
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ✅ <b>Registration Verified</b>

          <br><br>

          Welcome,
          <b>${escapeHtml(result.name)}</b>

          <br><br>

          Your mobile number is registered
          with Devang Pustika.

        `);


        // Show E-book after verification
        loadVerifiedEbook();

        return;
      }


      // ==========================================
      // INVALID MOBILE NUMBER
      // ==========================================

      if (
        result.invalidMobile === true
      ) {

        botMessage(`

          ⚠️ <b>Invalid Mobile Number</b>

          <br><br>

          Please enter a valid
          10-digit mobile number.

          <br><br>

          Example: 9876543210

        `);

        return;
      }


      // ==========================================
      // NOT REGISTERED
      // ==========================================

      if (
        result.success === true &&
        result.verified === false
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ⚠️ <b>Mobile Number Not Registered</b>

          <br><br>

          This mobile number was not found
          in our registration records.

          <br><br>

          Please register your name first
          to access the E-book.

        `);


        showRegistrationButton();

        return;
      }


      // ==========================================
      // OTHER SERVER ERROR
      // ==========================================

      chatbotState = "normal";

      resetChatInput();


      botMessage(
        "⚠️ " +
        (
          result.message ||
          "Unable to verify your registration."
        )
      );

    })


    .withFailureHandler(function(error) {

      hideTyping();

      chatbotState = "normal";

      resetChatInput();

      console.error(
        "Verification Error:",
        error
      );


      botMessage(`

        ⚠️ <b>Verification Error</b>

        <br><br>

        ${error.message || error}

      `);

    })


    .verifyEbookUser(mobile);

}


function requestProfileSearchAccess(type) {

  pendingProfileSearchType =
    type;


  // ==========================================
  // ALREADY VERIFIED IN CURRENT SESSION
  // ==========================================

  if (profileAccessVerified) {

    startProfileSearch(type);

    return;
  }


  // ==========================================
  // WAIT FOR MOBILE NUMBER
  // ==========================================

  chatbotState =
    "profile_mobile_verification";


  botMessage(`

    🔐 <b>Profile Search Verification</b>

    <br><br>

    प्रोफाइल शोधण्यासाठी आपला
    नोंदणीकृत मोबाईल नंबर टाका.

    <br><br>

    📱 <b>10 अंकी मोबाईल नंबर टाका.</b>

  `);


  const input =
    document.getElementById("message");


  input.placeholder =
    "Enter registered mobile number...";


  input.focus();

}
/* =========================================
   MENU CLICK
========================================= */

function menuClick(option) {

  switch (option) {

    case "registration":

      userMessage(
        "📝 Registration"
      );

      loadLink(
        "registration"
      );

      break;


      case "ebook":

        userMessage(
          "📘 Download E-book"
        );

        startEbookVerification();

        break;


    case "contact":

      userMessage(
        "☎ Contact Us"
      );

      loadLink(
        "contact"
      );

      break;


      case "bride":

      userMessage(
        "👰 Search Bride"
      );

        requestProfileSearchAccess(
          "bride"
        );

      break;

        case "groom":

        userMessage(
          "🤵 Search Groom"
        );

        requestProfileSearchAccess(
          "groom"
        );

        break;

    case "other":

      userMessage(
        "👤 Search Other"
      );

       requestProfileSearchAccess(
        "other"
      );

      break;  

  }

}



function verifyProfileMobile(mobile) {

  const cleanMobile =
    mobile.replace(/\D/g, "");


  if (cleanMobile.length !== 10) {

    botMessage(
      "⚠️ कृपया योग्य 10 अंकी मोबाईल नंबर टाका."
    );

    return;

  }


  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        if (
  result &&
  result.verified
) {

  profileAccessVerified =
    true;


   profileUserMobile =
    String(
      result.mobile || ""
    ).trim();


    profileUserName =
    result.name || "";


   profileUserRegisteredSheet =
    result.registeredSheet || "";


  chatbotState =
    "normal";


  botMessage(`

    ✅ <b>Verification Successful</b>

    <br><br>

    नमस्कार
     <b>${escapeHtml(result.name || "")}</b>


  `);


  // ========================================
  // USER CAME FROM LIKED PROFILES
  // ========================================

  if (
    pendingProfileCategory === "liked"
  ) {

    pendingProfileCategory = "";

    showLikedProfiles();

    return;

  }


  // ========================================
  // USER CAME FROM DISLIKED PROFILES
  // ========================================

  if (
    pendingProfileCategory === "disliked"
  ) {

    pendingProfileCategory = "";

    showDislikedProfiles();

    return;

  }


      // ========================================
      // USER WAITING FOR SENT INTERESTS
      // ========================================

      if (
        pendingProfileCategory ===
        "sentInterests"
      ) {

        pendingProfileCategory = "";


        console.log(
          "OPENING SENT INTERESTS AFTER VERIFICATION"
        );


        showSentInterests();


        return;

      }


    // ========================================
    // RECEIVED INTERESTS AFTER VERIFICATION
    // ========================================

    if (
      pendingProfileCategory ===
      "receivedInterests"
    ) {

      pendingProfileCategory = "";


      console.log(
        "OPENING RECEIVED INTERESTS AFTER VERIFICATION"
      );


      showReceivedInterests();


      return;

    }


  // ========================================
  // NORMAL PROFILE SEARCH FLOW
  // ========================================

  if (
    pendingProfileSearchType
  ) {

    startProfileSearch(
      pendingProfileSearchType
    );

    return;

  }


  // ========================================
  // NORMAL VERIFICATION
  // ========================================

  botMessage(`

    आता तुम्ही प्रोफाइल शोधू शकता.

  `);

}else {

  // ========================================
  // MOBILE NOT REGISTERED
  // ========================================

  profileAccessVerified =
    false;


  profileUserMobile = "";

  profileUserName = "";

  profileUserRegisteredSheet = "";


  chatbotState =
    "normal";


  // Clear pending category
  pendingProfileCategory = "";


  botMessage(`

    🔐 <b>Please Login / Verify</b>

    <br><br>

    हा मोबाईल नंबर वधू / वर / इतर
    नोंदणीमध्ये आढळला नाही.

    <br><br>

    कृपया आपला
    <b>Registered Mobile Number</b>
    वापरा.

    <br><br>

    नोंदणी केलेली नसल्यास
    प्रथम आपली नोंदणी करा.

  `);


  // ========================================
  // YOUR EXISTING REGISTER BUTTON CODE
  // ========================================

  google.script.run

    .withSuccessHandler(
      function(data) {

        if (
          data &&
          data.registration &&
          data.registration.url
        ) {

          const chat =
            document.getElementById(
              "chat"
            );


          chat.innerHTML += `

            <div class="menu">

              <button
                onclick="window.open(
                  '${data.registration.url}',
                  '_blank'
                )"
              >

                📝 Register Now

              </button>

            </div>

          `;


          chat.scrollTop =
            chat.scrollHeight;

        }

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Registration Link Error:",
          error
        );

      }
    )


    .getChatLinks();

}



      }
    )


    .withFailureHandler(
      function(error) {

        hideTyping();


        botMessage(
          "⚠️ Verification करताना समस्या आली. कृपया पुन्हा प्रयत्न करा."
        );

      }
    )


    .verifyProfileSearchAccess(
      cleanMobile
    );

}

  profileSearchDistrict = "";

  profileSearchPage = 1;

  chatbotState = "profile_search";

  profileSearchEducation = "";


  let title = "";


  if (type === "bride") {

    title = "👰 Bride Search";

  }

  else if (type === "groom") {

    title = "🤵 Groom Search";

  }

  else {

    title = "👤 Other Profile Search";

  }


  botMessage(`

    <b>${title}</b>

    <br><br>

    Please select a district:

  showDistrictOptions();

}

function searchChatProfiles() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        chatbotState =
          "normal";


        if (!result) {

          botMessage(
            "⚠️ Search response not received."
          );

          return;

        }


        if (
          result.success !== true
        ) {

          botMessage(
            "⚠️ " +
            (
              result.message ||
              "Unable to search profiles."
            )
          );

          return;

        }


        if (
          !result.profiles ||
          result.profiles.length === 0
        ) {

          botMessage(`

            🔍 <b>No matching profiles found.</b>

            <br><br>

            Please try another district.

          `);


          showSearchAgainButton();

          return;

        }


            const fromProfile =
          ((result.page - 1) * result.pageSize) + 1;


        const toProfile =
          Math.min(
            result.page * result.pageSize,
            result.totalCount
          );


                  const resultSectionId =
            "profile-results-" + Date.now();


          const selectedFiltersHtml =
            getSelectedFiltersHtml();


          botMessage(`

            <div id="${resultSectionId}">

              🔍 <b>${result.totalCount} Matching Profiles Found</b>

              <br><br>

              ${selectedFiltersHtml}

              <br>

              <div class="result-count">

                Showing profiles
                <b>${fromProfile} – ${toProfile}</b>
                of
                <b>${result.totalCount}</b>

                <br>

                Page
                <b>${result.page}</b>
                of
                <b>${result.totalPages}</b>

              </div>

            </div>

          `);     

          profileCurrentPage =
          Number(
            result.page || 1
          );

          displayProfileResults(
            result.profiles,
            result.page,
            result.pageSize
          );
          
        saveProfileSearchLog(result);
        showProfilePagination(result);

        setTimeout(function() {

            const resultSection =
              document.getElementById(
                resultSectionId
              );


              if (resultSection) {

                resultSection.scrollIntoView({
                  behavior: "smooth",
                  block: "start"
                });

              }

          }, 100);

        }
      )


    .withFailureHandler(
      function(error) {

        hideTyping();

        chatbotState =
          "normal";


        console.error(
          "Profile Search Error:",
          error
        );


        botMessage(

          "⚠️ Unable to search profiles. Please try again."

        );

      }
    )


      .searchProfiles(
        profileSearchType,
        profileSearchDistrict,
        profileSearchEducation,
        profileSearchIncome,
        profileSearchPage,
        profileUserMobile
      );

}

// ==========================================
// COMMON INTEREST STATUS UI
// Used by Search Card + Full Profile
// ==========================================

function getInterestStatusHtml(
  interestStatus
) {

  interestStatus =
    String(
      interestStatus || "NONE"
    )
    .trim()
    .toUpperCase();


  // ========================================
  // PENDING - SENT
  // ========================================

  if (
    interestStatus === "PENDING_SENT"
  ) {

    return `

      <div class="profile-interest-status pending">

        ⏳ <b>Pending</b>

      </div>

    `;

  }


  // ========================================
  // PENDING - RECEIVED
  // ========================================

  if (
    interestStatus === "PENDING_RECEIVED"
  ) {

    return `

      <div class="profile-interest-status pending">

        ⏳ <b>Pending</b>

      </div>

    `;

  }


  // ========================================
  // ACCEPTED
  // ========================================

  if (
    interestStatus === "ACCEPTED"
  ) {

    return `

      <div class="profile-interest-status accepted">

        ❤️ <b>Accepted</b>

      </div>

    `;

  }


  // ========================================
  // DECLINED
  // ========================================

  if (
    interestStatus === "DECLINED"
  ) {

    return `

      <div class="profile-interest-status declined">

        ❌ <b>Declined</b>

      </div>

    `;

  }


  // NONE = no status UI
  return "";

}




// ==========================================
// COMMON PROFILE INTEREST UI
// Used by Search / Liked / other profile cards
// ==========================================

function getProfileInterestActions(
  profile,
  profileType,
  profileId,
  profileName
) {

  // ========================================
  // 1. RELATIONSHIP
  // ========================================

  const relationship =
    profile &&
    profile.interestRelationship
      ? profile.interestRelationship
      : {};


  // ========================================
  // 2. STATUS
  // ========================================

  const interestStatus =
    String(
      relationship.status || "NONE"
    )
    .trim()
    .toUpperCase();


  // ========================================
  // 3. CONTACT PERMISSION
  // ========================================

  const canViewContact =
    relationship.canViewContact === true;


  // ========================================
  // 4. SAFE VALUES
  // ========================================

  const safeType =
    escapeJsValue(
      String(profileType || "")
        .trim()
        .toLowerCase()
    );


  const safeId =
    escapeJsValue(
      String(profileId || "")
        .trim()
    );


  const safeName =
    escapeJsValue(
      String(profileName || "")
        .trim()
    );


  // ========================================
  // 5. STATUS HTML
  // Reuse existing common function
  // ========================================

  const statusHtml =
    getInterestStatusHtml(
      interestStatus
    );


  // ========================================
  // 6. ACTION BUTTON
  // ========================================

  let actionHtml = "";


  // ========================================
  // ACCEPTED
  // Show Contact Details
  // ========================================

  if (
    interestStatus === "ACCEPTED" &&
    canViewContact === true
  ) {

    actionHtml = `

      <button
        type="button"
        class="view-profile-btn"
        onclick="viewProfileContact(
          '${safeType}',
          '${safeId}'
        )"
      >

        ☎ View Contact Details

      </button>

    `;

  }


  // ========================================
  // NO INTEREST RELATIONSHIP
  // Show Send Interest
  // ========================================

  else if (
    interestStatus === "NONE"
  ) {

    actionHtml = `

      <button
        type="button"
        class="send-interest-btn"
        onclick="openSendInterestConfirmation(
          '${safeType}',
          '${safeId}',
          '${safeName}'
        )"
      >

        💌 Send Interest

      </button>

    `;

  }


  // ========================================
  // PENDING / DECLINED
  // No action button
  // Status is displayed by statusHtml
  // ========================================

  else {

    actionHtml = "";

  }


  // ========================================
  // 8. RETURN
  // ========================================

  return {

    relationship:
      relationship,

    status:
      interestStatus,

    canViewContact:
      canViewContact,

    statusHtml:
      statusHtml,

    actionHtml:
      actionHtml

  };

}

          key === "ebook"
        ) {

            "📘 Open E-book";

        if (

        ) {

          buttonText =
            "☎ Contact Us";

        botMessage(`

          </b>

          <br><br>

          <a
            class="chat-action-button"
            href="${item.url}"
            target="_blank"

function profileRow(

  value

  }


  return `

    <div class="full-profile-row">

      <div class="full-profile-label">
        ${icon}
        <b>${escapeHtml(label)}:</b>
      </div>

      <div class="full-profile-value">
        ${escapeHtml(value)}
      </div>

    </div>

  `;

}


function escapeJsValue(value) {

  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "")
    .replace(/\n/g, "\\n");

}

function reactToProfile(
  type,
  profileId,
  profileName,
  reaction,
  button,
) {

  // ==========================================
  // VERIFIED USER ONLY
  // ==========================================

  if (!profileAccessVerified) {

    botMessage(`

      🔐 <b>Verification Required</b>

      <br><br>

      Profile Like किंवा Dislike करण्यासाठी
      प्रथम registered mobile number verify करा.

    `);

    return;

  }


  if (
    !type ||
    !profileId ||
    !reaction
  ) {

    return;

  }


  const originalText =
    button
      ? button.innerHTML
      : "";


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (button) {
          button.disabled = false;
        }


        if (
          !result ||
          !result.success
        ) {

          if (button) {
            button.innerHTML =
              originalText;
          }


          botMessage(
            "⚠️ Reaction save झाली नाही. कृपया पुन्हा प्रयत्न करा."
          );

          return;

        }


        // ====================================
        // LIKE
        // ====================================

        if (
          result.reaction === "LIKE"
        ) {

          updateReactionButtons(
            type,
            profileId,
            "LIKE"
          );

        }


        // ====================================
        // DISLIKE
        // ====================================

        else if (
          result.reaction === "DISLIKE"
        ) {

          updateReactionButtons(
            type,
            profileId,
            "DISLIKE"
          );

        }

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Profile Reaction Error:",
          error
        );


        if (button) {

          button.disabled = false;

          button.innerHTML =
            originalText;

        }

      }
    )


    .saveProfileReaction(

      profileUserMobile,

      profileUserName,

      profileUserRegisteredSheet,

      type,

      profileId,

      profileName,

      reaction

    );

}

    );


  const dislikeButton =
    document.querySelector(
      `[data-dislike="${key}"]`

  if (likeButton) {

      true;

  }

}

function scrollProfileSectionToTop(
  sectionId
) {

  setTimeout(function() {

    const chat =
      document.getElementById("chat");

    const section =
      document.getElementById(
        sectionId
      );


    if (
      !chat ||
      !section
    ) {

      console.log(
        "Scroll target not found:",
        sectionId
      );

      return;

    }


    // Section position relative to chat container
    const chatRect =
      chat.getBoundingClientRect();


    const sectionRect =
      section.getBoundingClientRect();


    const targetTop =
      chat.scrollTop +
      sectionRect.top -
      chatRect.top -
      10;


    chat.scrollTo({

      top:
        targetTop,

      behavior:
        "smooth"

    });


    console.log(
      "SCROLLED TO:",
      sectionId
    );

  }, 300);

}

function displayDislikedProfileResults(
  profiles
) {

  if (
    !profiles ||
    profiles.length === 0
  ) {
    return;
  }


  profiles.forEach(
    function(profile, index) {

      displayDislikedProfileCard(
        profile,
        index + 1
      );

    }
  );

}


function displayDislikedProfileCard(
  profile,
  profileNumber
) {

  // ==========================================
  // PROFILE BASIC VALUES
  // ==========================================

  const currentProfileType =
    String(
      profile.type || ""
    )
    .trim()
    .toLowerCase();


  const currentProfileId =
    String(
      profile.id || ""
    ).trim();


  const currentProfileName =
    String(
      profile.name || ""
    ).trim();


  // ==========================================
  // PROFILE ICON
  // ==========================================

  let profileIcon = "👤";


  if (
    currentProfileType === "bride"
  ) {

    profileIcon = "👰";

  }

  else if (
    currentProfileType === "groom"
  ) {

    profileIcon = "🤵";

  }


  // ==========================================
  // SAFE VALUES
  // ==========================================

  const safeType =
    escapeJsValue(
      currentProfileType
    );


  const safeId =
    escapeJsValue(
      currentProfileId
    );


  const safeName =
    escapeJsValue(
      currentProfileName
    );


  // ==========================================
  // DISPLAY VALUES
  // ==========================================

  const name =
    escapeHtml(
      currentProfileName || "-"
    );


  const district =
    escapeHtml(
      profile.district || "-"
    );


  const education =
    escapeHtml(
      profile.education || "-"
    );


  const age =
    escapeHtml(
      profile.age || "-"
    );


  const height =
    escapeHtml(
      profile.height || "-"
    );


  const caste =
    escapeHtml(
      profile.caste || "-"
    );


  const job =
    escapeHtml(
      profile.job || "-"
    );


  const income =
    escapeHtml(
      profile.income || "-"
    );


  const photo =
    profile.photo || "";


  // ==========================================
  // PROFILE IMAGE
  // ==========================================

  let photoHtml = "";


  if (photo) {

    photoHtml = `

      <div class="profile-photo-container">

        <img
          src="${photo}"
          class="profile-photo"
          alt="Profile Photo"
          loading="lazy"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="profile-photo-placeholder"
          style="display:none;"
        >

          ${profileIcon}

        </div>

      </div>

    `;

  }

  else {

    photoHtml = `

      <div class="profile-photo-container">

        <div
          class="profile-photo-placeholder"
        >

          ${profileIcon}

        </div>

      </div>

    `;

  }


  // ==========================================

  // ==========================================

  botMessage(`

    <div class="profile-card">


      ${photoHtml}

        ${profileIcon}

      </div>


      <div class="profile-name">

        ${name}

      </div>


      <div class="profile-details">


        <div>
          <b>📍 जिल्हा:</b>
          ${district}
        </div>


        <div>
          <b>🎓 शिक्षण:</b>
          ${education}
        </div>


        <div>
          <b>🎂 वय:</b>
          ${age}
        </div>


        <div>
          <b>📏 उंची:</b>
          ${height}
        </div>


        <div>
          <b>👥 पोट जात:</b>
          ${caste}
        </div>


        <div>
          <b>💼 नोकरी / व्यवसाय:</b>
          ${job}
        </div>


        <div>
          <b>💰 मासिक उत्पन्न:</b>
          ${income}
        </div>


      </div>


      <!-- VIEW FULL PROFILE -->

      <div class="profile-actions">

        <button
          type="button"
          class="view-profile-btn"
          onclick="
            viewFullProfile(
              '${safeType}',
              '${safeId}'
            )
          "
        >

          👤 View Full Profile

        </button>

      </div>


      <!-- LIKE / DISLIKE -->

      <div class="profile-reaction-actions">


        <!-- CHANGE TO LIKE -->

        <button
          type="button"
          class="profile-reaction-btn"
          onclick="
            changeDislikedProfileToLike(

              '${safeId}',
              '${safeName}',
              this

          class="profile-reaction-btn disliked-active"

function changeDislikedProfileToLike(
  type,
  profileId,
  profileName,
  button
) {

  if (
    !profileAccessVerified
  ) {
    return;
  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          !result ||
          !result.success
        ) {

          if (button) {

            button.disabled = false;

            button.innerHTML =
              "♡ Like";

          }

          botMessage(
            "⚠️ Reaction update झाली नाही."
          );

          return;

        }


        botMessage(`

          ❤️ <b>Profile Liked</b>

          <br><br>

          ही profile आता तुमच्या
          Liked Profiles मध्ये आहे.

        // Refresh disliked list
        showDislikedProfiles();

    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Reaction Update Error:",
          error
        );


        if (button) {

          button.disabled = false;

          button.innerHTML =
            "♡ Like";

        }

    )


    .saveProfileReaction(

      profileUserMobile,

      profileUserName,

      profileUserRegisteredSheet,

      type,

      profileId,

      profileName,

      "LIKE"

    );
