/* =========================================
   ENTER KEY
========================================= */

function handleKey(e) {

  if (e.key === "Enter") {

    sendMessage();

  }

}


/* =========================================
   SEND USER MESSAGE
========================================= */


function sendMessage() {

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();


  if (text === "") {
    return;
  }


  // Show user's message
  userMessage(text);

  input.value = "";


  /*
   * ===================================
   * E-BOOK MOBILE VERIFICATION
   * ===================================
   */

  if (
    chatbotState ===
    "waiting_for_ebook_mobile"
  ) {

    verifyEbookMobile(text);

    return;
  }


  /*
   * ===================================
   * PROFILE SEARCH MOBILE VERIFICATION
   * ===================================
   */

if (
  chatbotState ===
  "profile_mobile_verification"
) {

  // Remove spaces, +91, hyphens, etc.
  let mobile =
    text.replace(/\D/g, "");


  // Handle 91XXXXXXXXXX
  if (
    mobile.length === 12 &&
    mobile.startsWith("91")
  ) {

    mobile =
      mobile.substring(2);
  }


  // ==========================================
  // INVALID MOBILE INPUT
  // ==========================================

  if (
    !/^[6-9]\d{9}$/.test(mobile)
  ) {

    botMessage(`

      ⚠️ <b>Invalid Mobile Number</b>

      <br><br>

      कृपया नोंदणी करताना दिलेला
      <b>10 अंकी मोबाईल नंबर</b> टाका.

      <br><br>

      उदाहरण: <b>9876543210</b>

    `);

    return;
  }


  // ==========================================
  // VALID MOBILE FORMAT
  // ==========================================

  verifyProfileMobile(mobile);

  return;
}


  /*
   * ===================================
   * NORMAL FAQ / AI CHAT
   * ===================================
   */

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        if (
          result &&
          result.found
        ) {

          botMessage(
            result.answer
          );


          if (
            result.action &&
            result.action !== "none"
          ) {

            handleAction(
              result.action
            );

          }

        }

          else {

                const invalidMessageId =
              "invalid-chat-message-" +
              Date.now();


            botMessage(`

              <div id="${invalidMessageId}">

                👋 <b>Welcome to Devang Pustika</b>

                <br><br>

                माफ करा, तुमचा प्रश्न मला समजला नाही.

                <br><br>

                मी तुम्हाला खालील पर्यायांमध्ये मदत करू शकतो.

                <br><br>

                कृपया एक पर्याय निवडा.

              </div>

            `);


            // Scroll specifically to invalid message
            setTimeout(
              function() {

                scrollToChatSection(
                  invalidMessageId
                );

              },
              100
            );


            // Show main chatbot menu again
            showMenu();

          }

      }
    )

    .withFailureHandler(
      function(error) {

        hideTyping();

        console.error(error);

        botMessage(
          "⚠️ Something went wrong. Please try again."
        );

      }
    )

    .askBot(text);

}

function verifyEbookMobile(mobile) {

  // Remove spaces from beginning/end
  mobile = mobile.trim();

  if (mobile === "") {

    botMessage(
      "⚠️ Please enter your registered mobile number."
    );

    return;
  }


  // Show typing while checking Google Sheet
  showTyping();


  google.script.run

    .withSuccessHandler(function(result) {

      hideTyping();

      console.log("Verification Result:", result);


      // No response received
      if (!result) {

        botMessage(
          "⚠️ No response received from the verification system."
        );

        return;
      }


      // ==========================================
      // REGISTERED USER
      // ==========================================

      if (
        result.success === true &&
        result.verified === true
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ✅ <b>Registration Verified</b>

          <br><br>

          Welcome,
          <b>${escapeHtml(result.name)}</b>

          <br><br>

          Your mobile number is registered
          with Devang Pustika.

        `);


        // Show E-book after verification
        loadVerifiedEbook();

        return;
      }


      // ==========================================
      // INVALID MOBILE NUMBER
      // ==========================================

      if (
        result.invalidMobile === true
      ) {

        botMessage(`

          ⚠️ <b>Invalid Mobile Number</b>

          <br><br>

          Please enter a valid
          10-digit mobile number.

          <br><br>

          Example: 9876543210

        `);

        return;
      }


      // ==========================================
      // NOT REGISTERED
      // ==========================================

      if (
        result.success === true &&
        result.verified === false
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ⚠️ <b>Mobile Number Not Registered</b>

          <br><br>

          This mobile number was not found
          in our registration records.

          <br><br>

          Please register your name first
          to access the E-book.

        `);


        showRegistrationButton();

        return;
      }


      // ==========================================
      // OTHER SERVER ERROR
      // ==========================================

      chatbotState = "normal";

      resetChatInput();


      botMessage(
        "⚠️ " +
        (
          result.message ||
          "Unable to verify your registration."
        )
      );

    })


    .withFailureHandler(function(error) {

      hideTyping();

      chatbotState = "normal";

      resetChatInput();

      console.error(
        "Verification Error:",
        error
      );


      botMessage(`

        ⚠️ <b>Verification Error</b>

        <br><br>

        ${error.message || error}

      `);

    })


    .verifyEbookUser(mobile);

}


function requestProfileSearchAccess(type) {

  pendingProfileSearchType =
    type;


  // ==========================================
  // ALREADY VERIFIED IN CURRENT SESSION
  // ==========================================

  if (profileAccessVerified) {

    startProfileSearch(type);

    return;
  }


  // ==========================================
  // WAIT FOR MOBILE NUMBER
  // ==========================================

  chatbotState =
    "profile_mobile_verification";


  botMessage(`

    🔐 <b>Profile Search Verification</b>

    <br><br>

    प्रोफाइल शोधण्यासाठी आपला
    नोंदणीकृत मोबाईल नंबर टाका.

    <br><br>

    📱 <b>10 अंकी मोबाईल नंबर टाका.</b>

  `);


  const input =
    document.getElementById("message");


  input.placeholder =
    "Enter registered mobile number...";


  input.focus();

}

function verifyProfileMobile(mobile) {

  const cleanMobile =
    mobile.replace(/\D/g, "");


  if (cleanMobile.length !== 10) {

    botMessage(
      "⚠️ कृपया योग्य 10 अंकी मोबाईल नंबर टाका."
    );

    return;

  }


  showTyping();


  google.script.run

    String(

     <b>${escapeHtml(result.name || "")}</b>

  // ========================================

  if (
    pendingProfileCategory === "liked"
  ) {

    pendingProfileCategory = "";

    showLikedProfiles();

    return;

  }


  // ========================================
  // USER CAME FROM DISLIKED PROFILES

  if (
    pendingProfileCategory === "disliked"

    pendingProfileCategory = "";

    showDislikedProfiles();

  }


      // ========================================
      // USER WAITING FOR SENT INTERESTS

      if (

        "sentInterests"

        pendingProfileCategory = "";


        console.log(
          "OPENING SENT INTERESTS AFTER VERIFICATION"

        showSentInterests();


        return;

      }


    // ========================================
    // RECEIVED INTERESTS AFTER VERIFICATION

    if (
      pendingProfileCategory ===
      "receivedInterests"
    ) {

      pendingProfileCategory = "";


      console.log(
        "OPENING RECEIVED INTERESTS AFTER VERIFICATION"

      showReceivedInterests();

  // ========================================

  // ========================================

function searchChatProfiles() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        chatbotState =
          "normal";


        if (!result) {

          botMessage(
            "⚠️ Search response not received."
          );

          return;

        }


        if (
          result.success !== true
        ) {

          botMessage(
            "⚠️ " +
            (
              result.message ||
              "Unable to search profiles."
            )
          );

          return;

        }


        if (
          !result.profiles ||
          result.profiles.length === 0
        ) {

          botMessage(`

            🔍 <b>No matching profiles found.</b>

            <br><br>

            Please try another district.

          `);


          showSearchAgainButton();

          return;

        }


            const fromProfile =
          ((result.page - 1) * result.pageSize) + 1;


        const toProfile =
          Math.min(
            result.page * result.pageSize,
            result.totalCount
          );


                  const resultSectionId =
            "profile-results-" + Date.now();


          const selectedFiltersHtml =
            getSelectedFiltersHtml();


          botMessage(`

            <div id="${resultSectionId}">

              🔍 <b>${result.totalCount} Matching Profiles Found</b>

              <br><br>

              ${selectedFiltersHtml}

              <br>

              <div class="result-count">

                Showing profiles
                <b>${fromProfile} – ${toProfile}</b>
                of
                <b>${result.totalCount}</b>

                <br>

                Page
                <b>${result.page}</b>
                of
                <b>${result.totalPages}</b>

              </div>

            </div>

          `);     

          profileCurrentPage =
          Number(
            result.page || 1
          );

          displayProfileResults(
            result.profiles,
            result.page,
            result.pageSize
          );
          
        saveProfileSearchLog(result);
        showProfilePagination(result);

        setTimeout(function() {

            const resultSection =
              document.getElementById(
                resultSectionId
              );


              if (resultSection) {

                resultSection.scrollIntoView({
                  behavior: "smooth",
                  block: "start"
                });

              }

          }, 100);

        }
      )


    .withFailureHandler(
      function(error) {

        hideTyping();

        chatbotState =
          "normal";


        console.error(
          "Profile Search Error:",
          error
        );


        botMessage(

          "⚠️ Unable to search profiles. Please try again."

        );

      }
    )


      .searchProfiles(
        profileSearchType,
        profileSearchDistrict,
        profileSearchEducation,
        profileSearchIncome,
        profileSearchPage,
        profileUserMobile
      );

}

function displayProfileResults(

    profiles,

    page,

    pageSize

) {

    lastSearchProfiles = profiles;

    lastSearchPage = page;

    lastSearchPageSize = pageSize;


    console.log(
        "CURRENT PROFILE SEARCH TYPE:",
        profileSearchType
    );


    const pageScrollMarkerId =
        "profile-search-page-" +
        String(page) +
        "-" +
        Date.now();


    window.lastRenderedProfiles =
        profiles;


    let cardsHtml = "";


    profiles.forEach(
        function(profile, index) {


            // ========================================
            // PROFILE TYPE / ID / NAME
            // ========================================

            const currentProfileType =
                String(
                    profile.type ||
                    profileSearchType ||
                    ""
                )
                .trim()
                .toLowerCase();


            const currentProfileId =
                String(
                    profile.id || ""
                ).trim();


            const currentProfileName =
                String(
                    profile.name || ""
                ).trim();


            // ========================================
            // COMMON INTEREST UI
            // ========================================

            const interestUI =
                getProfileInterestActions(
                    profile,
                    currentProfileType,
                    currentProfileId,
                    currentProfileName
                );


            const profileActions =
                buildProfileActionButtons(
                    profile,
                    profile.relationship
                );


            // ========================================
            // SAFE VALUES FOR BUTTONS
            // ========================================

            const safeType =
                escapeJsValue(
                    currentProfileType
                );


            const safeId =
                escapeJsValue(
                    currentProfileId
                );


            // ========================================
            // PROFILE ICON
            // ========================================

            let profileIcon = "👤";


            if (
                currentProfileType === "bride"
            ) {

                profileIcon = "👰";

            }

            else if (
                currentProfileType === "groom"
            ) {

                profileIcon = "🤵";

            }


            // ========================================
            // PROFILE DATA
            // ========================================

            const name =
                escapeHtml(
                    currentProfileName || "-"
                );


            const district =
                escapeHtml(
                    profile.district || "-"
                );


            const education =
                escapeHtml(
                    profile.education || "-"
                );


            const age =
                escapeHtml(
                    profile.age || "-"
                );


            const height =
                escapeHtml(
                    profile.height || "-"
                );


            const caste =
                escapeHtml(
                    profile.caste || "-"
                );


            const job =
                escapeHtml(
                    profile.job || "-"
                );


            const income =
                escapeHtml(
                    profile.income || "-"
                );


            const photo =
                profile.photo || "";


            // ========================================
            // PROFILE PHOTO
            // ========================================

            const photoHtml =
                buildProfilePhoto({

                    photo:
                        photo,

                    profileType:
                        currentProfileType,

                    markerId:
                        pageScrollMarkerId

                });


            // ========================================
            // PROFILE HEADER
            // ========================================

            const headerHtml =
                buildProfileHeader({

                    icon:
                        profileIcon,

                    profileNumber:
                        (
                            (page - 1) *
                            pageSize
                        ) +
                        index +
                        1,

                    name:
                        currentProfileName || "-"

                });


            // ========================================
            // PROFILE DETAILS
            // ========================================

            const detailsHtml =
                buildProfileDetails({

                    district:
                        profile.district || "-",

                    education:
                        profile.education || "-",

                    age:
                        profile.age || "-",

                    height:
                        profile.height || "-",

                    caste:
                        profile.caste || "-",

                    job:
                        profile.job || "-",

                    income:
                        profile.income || "-"

                });


            // ========================================
            // VIEW FULL PROFILE
            // ========================================

            const profileActionsHtml = `

                <div class="profile-actions">

                    <button
                        type="button"
                        class="view-profile-btn"
                        onclick="viewFullProfile(
                            '${safeType}',
                            '${safeId}'
                        )"
                    >

                        👤 View Full Profile

                    </button>

                </div>

            `;


            // ========================================
            // INTEREST STATUS
            // ========================================

            const interestStatusHtml =
                interestUI.statusHtml || "";


            // ========================================
            // INTEREST ACTION
            // ========================================

            const interestActionHtml =
                interestUI.actionHtml || "";


            // ========================================
            // REACTION HTML
            // ========================================

            const reactionHtml =
                profileActions || "";


            // ========================================
            // BUILD COMPLETE PROFILE CARD
            // ========================================

            cardsHtml +=
                buildProfileCard({

                    photoHtml:
                        photoHtml,

                    headerHtml:
                        headerHtml,

                    detailsHtml:
                        detailsHtml,

                    profileActionsHtml:
                        profileActionsHtml,

                    interestStatusHtml:
                        interestStatusHtml,

                    interestActionHtml:
                        interestActionHtml,

                    reactionHtml:
                        reactionHtml

                });


        }
    );


    // ========================================
    // RENDER PROFILE CARDS
    // ========================================

    botMessage(
        cardsHtml
    );


    // ========================================
    // SCROLL TO FIRST PROFILE OF THIS PAGE
    // ========================================

    scrollToCurrentProfilePage(
        pageScrollMarkerId
    );

}

function loadLink(key) {

    .withSuccessHandler(
      function (data) {

        hideTyping();

        if (
          !data ||
          !data[key]
        ) {

          botMessage(
            "⚠️ Link is currently unavailable."
          );

          return;

        }

        const item =
          data[key];


        let buttonText =
          "Open";


        if (
          key === "registration"
        ) {

          buttonText =
            "📝 Register Now";

        }


        if (
          key === "ebook"
        ) {

          buttonText =
            "📘 Open E-book";

        }


        if (
          key === "contact"
        ) {

          buttonText =
            "☎ Contact Us";

        }


        botMessage(`

          <b>
            ${item.title}
          </b>

          <br><br>

          <a
            class="chat-action-button"
            href="${item.url}"
            target="_blank"
            rel="noopener noreferrer">

            ${buttonText}

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);

        botMessage(
          "⚠️ Unable to load the link."
        );

      }
    )

    .getChatLinks();

}

function profileRow(
  icon,
  label,
  value
) {

  if (
    value === null ||
    value === undefined ||
    value.toString().trim() === ""
  ) {

    return "";

  }


  return `

    <div class="full-profile-row">

      <div class="full-profile-label">
        ${icon}
        <b>${escapeHtml(label)}:</b>
      </div>

      <div class="full-profile-value">
        ${escapeHtml(value)}
      </div>

    </div>

  `;

}


function escapeJsValue(value) {

  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "")
    .replace(/\n/g, "\\n");

}

function updateReactionButtons(
    type,
    profileId,
    relationship
) {

    // ========================================
    // VALIDATION
    // ========================================

    if (!relationship) {

        console.warn(
            "Relationship missing."
        );

        return;

    }

    // ========================================
    // KEY
    // ========================================

    const key =
        String(type).toLowerCase() +
        "_" +
        String(profileId);

    console.log("Updating:", key);

    // ========================================
    // FIND ACTION CONTAINER
    // ========================================

      const containers =
          document.querySelectorAll(
              `[data-actions="${key}"]`
          );

      if (!containers.length) {

          console.warn(
              "Action container not found:",
              key
          );

          return;

      }

    // ========================================
    // FIND PROFILE OBJECT
    // ========================================

    let profile = null;

    if (
        Array.isArray(
            window.lastRenderedProfiles
        )
    ) {

        profile =
            window.lastRenderedProfiles.find(function(p){

                return (

                    String(
                        p.viewerProfileType || p.type
                    ).toLowerCase() ===
                    String(type).toLowerCase()

                    &&

                    String(
                        p.viewerProfileId || p.id
                    ) ===
                    String(profileId)

                );

            });

    }

    console.log(
        "Matched Profile:",
        profile
    );

    if (!profile) {

        console.warn(
            "Profile not found."
        );

        return;

    }

    // ========================================
    // UPDATE LOCAL STATE
    // ========================================

    profile.relationship =
        relationship;

    profile.reaction =
        relationship.canLike
            ? ""
            : "LIKE";

    console.log(
        "Relationship:",
        relationship
    );

    // ========================================
    // BUILD NEW HTML
    // ========================================

        const html =
        buildProfileActionButtons(
            profile,
            relationship
        );

        containers.forEach(function(container){

            container.outerHTML = html;

        });



    // ========================================
    // REPLACE DOM
    // ========================================



    // ========================================
    // VERIFY DOM
    // ========================================

    setTimeout(function(){

        const updated =

            document.querySelector(
                `[data-actions="${key}"]`
            );

        console.log(
            "UPDATED DOM:",
            updated
        );

        if (updated) {

            console.log(
                updated.outerHTML
            );

        }

    },100);

}

function scrollProfileSectionToTop(
  sectionId
) {

  setTimeout(function() {

    const chat =
      document.getElementById("chat");

    const section =
      document.getElementById(
        sectionId
      );


    if (
      !chat ||
      !section
    ) {

      console.log(
        "Scroll target not found:",
        sectionId
      );

      return;

    }


    // Section position relative to chat container
    const chatRect =
      chat.getBoundingClientRect();


    const sectionRect =
      section.getBoundingClientRect();


    const targetTop =
      chat.scrollTop +
      sectionRect.top -
      chatRect.top -
      10;


    chat.scrollTo({

      top:
        targetTop,

      behavior:
        "smooth"

    });


    console.log(
      "SCROLLED TO:",
      sectionId
    );

  }, 300);

}

function displayDislikedProfileResults(
  profiles
) {

  if (
    !profiles ||
    profiles.length === 0
  ) {
    return;
  }


  profiles.forEach(
    function(profile, index) {

      displayDislikedProfileCard(
        profile,
        index + 1
      );

    }
  );

}


function displayDislikedProfileCard(
  profile,
  profileNumber
) {

  // ==========================================
  // PROFILE BASIC VALUES
  // ==========================================

  const currentProfileType =
    String(
      profile.type || ""
    )
    .trim()
    .toLowerCase();


  const currentProfileId =
    String(
      profile.id || ""
    ).trim();


  const currentProfileName =
    String(
      profile.name || ""
    ).trim();


  // ==========================================
  // PROFILE ICON
  // ==========================================

  let profileIcon = "👤";


  if (
    currentProfileType === "bride"
  ) {

    profileIcon = "👰";

  }

  else if (
    currentProfileType === "groom"
  ) {

    profileIcon = "🤵";

  }


  // ==========================================
  // SAFE VALUES
  // ==========================================

  const safeType =
    escapeJsValue(
      currentProfileType
    );


  const safeId =
    escapeJsValue(
      currentProfileId
    );


  const safeName =
    escapeJsValue(
      currentProfileName
    );

  const safeOwnerMobile =
  escapeJsValue(
      profile.ownerMobile || ""
  );

  // ==========================================
  // DISPLAY VALUES
  // ==========================================

  const name =
    escapeHtml(
      currentProfileName || "-"
    );


  const district =
    escapeHtml(
      profile.district || "-"
    );


  const education =
    escapeHtml(
      profile.education || "-"
    );


  const age =
    escapeHtml(
      profile.age || "-"
    );


  const height =
    escapeHtml(
      profile.height || "-"
    );


  const caste =
    escapeHtml(
      profile.caste || "-"
    );


  const job =
    escapeHtml(
      profile.job || "-"
    );


  const income =
    escapeHtml(
      profile.income || "-"
    );


  const photo =
    profile.photo || "";


  // ==========================================
  // PROFILE IMAGE
  // ==========================================

  let photoHtml = "";


  if (photo) {

    photoHtml = `

      <div class="profile-photo-container">

        <img
          src="${photo}"
          class="profile-photo"
          alt="Profile Photo"
          loading="lazy"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="profile-photo-placeholder"
          style="display:none;"
        >

          ${profileIcon}

        </div>

      </div>

    `;

  }

  else {

    photoHtml = `

      <div class="profile-photo-container">

        <div
          class="profile-photo-placeholder"
        >

          ${profileIcon}

        </div>

      </div>

    `;

  }


  // ==========================================
  // DISLIKED PROFILE CARD
  // ==========================================

  botMessage(`

    <div class="profile-card">


      ${photoHtml}


      <div class="profile-card-title">

        ${profileIcon}

        Disliked Profile ${profileNumber}

      </div>


      <div class="profile-name">

        ${name}

      </div>


      <div class="profile-details">


        <div>
          <b>📍 जिल्हा:</b>
          ${district}
        </div>


        <div>
          <b>🎓 शिक्षण:</b>
          ${education}
        </div>


        <div>
          <b>🎂 वय:</b>
          ${age}
        </div>


        <div>
          <b>📏 उंची:</b>
          ${height}
        </div>


        <div>
          <b>👥 पोट जात:</b>
          ${caste}
        </div>


        <div>
          <b>💼 नोकरी / व्यवसाय:</b>
          ${job}
        </div>


        <div>
          <b>💰 मासिक उत्पन्न:</b>
          ${income}
        </div>


      </div>


      <!-- VIEW FULL PROFILE -->

      <div class="profile-actions">

        <button
          type="button"
          class="view-profile-btn"
          onclick="
            viewFullProfile(
              '${safeType}',
              '${safeId}'
            )
          "
        >

          👤 View Full Profile

        </button>

      </div>


      <!-- LIKE / DISLIKE -->

      <div class="profile-reaction-actions">


        <!-- CHANGE TO LIKE -->

        <button
          type="button"
          class="profile-reaction-btn"
          onclick="
            changeDislikedProfileToLike(
                '${safeType}',
                '${safeId}',
                '${safeName}',
                '${safeOwnerMobile}',
                this
            )
          "
        >

          ♡ Like

        </button>


        <!-- ALREADY DISLIKED -->

        <button
          type="button"
          class="profile-reaction-btn disliked-active"
          disabled
        >

          👎 Disliked

        </button>


      </div>


    </div>

  `);

}


function changeDislikedProfileToLike(
  type,
  profileId,
  profileName,
  ownerMobile,
  button
) {

  console.log({
    ownerMobile: ownerMobile,
    type: type,
    profileId: profileId,
    profileName: profileName
});

  if (
    !profileAccessVerified
  ) {
    return;
  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          !result ||
          !result.success
        ) {

          if (button) {

            button.disabled = false;

            button.innerHTML =
              "♡ Like";

          }

          botMessage(
            "⚠️ Reaction update झाली नाही."
          );

          return;

        }


        botMessage(`

          ❤️ <b>Profile Liked</b>

          <br><br>

          ही profile आता तुमच्या
          Liked Profiles मध्ये आहे.

        `);


        // Refresh disliked list
        showDislikedProfiles();

      }
    )


    .withFailureHandler(
      function(error) {

        console.error(
          "Reaction Update Error:",
          error
        );


        if (button) {

          button.disabled = false;

          button.innerHTML =
            "♡ Like";

        }

      }
    )


  

  .saveProfileReaction(

      profileUserMobile,

      profileUserName,

      profileUserRegisteredSheet,

      profileUserType,

      profileUserId,

      type,

      profileId,

      profileName,

      ownerMobile,

       "LIKE"

  );

}

function buildProfileActionButtons(
    profile,
    relationship
) {

    relationship = relationship || {};

    const profileType =
        profile.viewerProfileType ||
        profile.type ||
        "";

    const profileId =
        profile.viewerProfileId ||
        profile.id ||
        "";

    const key =
        profileType + "_" + profileId;

    return `

        <div
            class="profile-action-group"
            data-actions="${key}"
        >

            ${buildLikeButton(
                profile,
                relationship
            )}

            ${buildDislikeButton(
                profile,
                relationship
            )}

            ${buildViewProfileButton(
                profile
            )}

        </div>

    `;

}


function buildViewProfileButton(
    profile
) {

    return `

        <button
            class="view-profile-btn"
            onclick="showFullProfileFromReaction(
                '${profile.viewerProfileType || profile.type}',
                '${profile.viewerProfileId || profile.id}'
            )">

            👀 View Profile

        </button>

    `;

}


function refreshCurrentProfileScreen() {

    switch(currentProfileScreen){

        case "SEARCH":

            displayProfileResults(

                lastSearchProfiles,

                lastSearchPage,

                lastSearchPageSize

            );

            break;

        case "LIKES_RECEIVED":

            showLikesReceived();

            break;

        case "LIKED":

            showLikedProfiles();

            break;

        case "DISLIKED":

            showDislikedProfiles();

            break;

    }

}
