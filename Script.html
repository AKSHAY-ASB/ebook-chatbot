<script>
  /* =========================================
   CHATBOT START
========================================= */
let chatbotState = "normal";
let profileSearchType = "";
let profileSearchDistrict = "";
let profileSearchPage = 1;
let profileSearchEducation = "";
let profileSearchIncome = "";

let profileAccessVerified = false;

let profileUserMobile = "";

let profileUserName = "";

let profileUserRegisteredSheet = "";

let pendingProfileSearchType = "";

let pendingProfileCategory = "";

let lastRenderedProfiles = [];

let profileUserId = "";

let profileUserType = "";

window.onload = function () {

  botMessage(
    "👋 Welcome to Devang Pustika"
  );

  botMessage(
    "How can I help you today?"
  );

  showMenu();

};


/* =========================================
   ENTER KEY
========================================= */

function handleKey(e) {

  if (e.key === "Enter") {

    sendMessage();

  }

}


/* =========================================
   SEND USER MESSAGE
========================================= */


function sendMessage() {

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();


  if (text === "") {
    return;
  }


  // Show user's message
  userMessage(text);

  input.value = "";


  /*
   * ===================================
   * E-BOOK MOBILE VERIFICATION
   * ===================================
   */

  if (
    chatbotState ===
    "waiting_for_ebook_mobile"
  ) {

    verifyEbookMobile(text);

    return;
  }


  /*
   * ===================================
   * PROFILE SEARCH MOBILE VERIFICATION
   * ===================================
   */

if (
  chatbotState ===
  "profile_mobile_verification"
) {

  // Remove spaces, +91, hyphens, etc.
  let mobile =
    text.replace(/\D/g, "");


  // Handle 91XXXXXXXXXX
  if (
    mobile.length === 12 &&
    mobile.startsWith("91")
  ) {

    mobile =
      mobile.substring(2);
  }


  // ==========================================
  // INVALID MOBILE INPUT
  // ==========================================

  if (
    !/^[6-9]\d{9}$/.test(mobile)
  ) {

    botMessage(`

      ⚠️ <b>Invalid Mobile Number</b>

      <br><br>

      कृपया नोंदणी करताना दिलेला
      <b>10 अंकी मोबाईल नंबर</b> टाका.

      <br><br>

      उदाहरण: <b>9876543210</b>

    `);

    return;
  }


  // ==========================================
  // VALID MOBILE FORMAT
  // ==========================================

  verifyProfileMobile(mobile);

  return;
}


  /*
   * ===================================
   * NORMAL FAQ / AI CHAT
   * ===================================
   */

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        if (
          result &&
          result.found
        ) {

          botMessage(
            result.answer
          );


          if (
            result.action &&
            result.action !== "none"
          ) {

            handleAction(
              result.action
            );

          }

        }

          else {

                const invalidMessageId =
              "invalid-chat-message-" +
              Date.now();


            botMessage(`

              <div id="${invalidMessageId}">

                👋 <b>Welcome to Devang Pustika</b>

                <br><br>

                माफ करा, तुमचा प्रश्न मला समजला नाही.

                <br><br>

                मी तुम्हाला खालील पर्यायांमध्ये मदत करू शकतो.

                <br><br>

                कृपया एक पर्याय निवडा.

              </div>

            `);


            // Scroll specifically to invalid message
            setTimeout(
              function() {

                scrollToChatSection(
                  invalidMessageId
                );

              },
              100
            );


            // Show main chatbot menu again
            showMenu();

          }

      }
    )

    .withFailureHandler(
      function(error) {

        hideTyping();

        console.error(error);

        botMessage(
          "⚠️ Something went wrong. Please try again."
        );

      }
    )

    .askBot(text);

}


/* =========================================
   BOT MESSAGE
========================================= */

function botMessage(message) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `

    <div class="bot">

      ${message}

    </div>

  `;

  scrollChat();

}

function getSelectedFiltersHtml() {

  // ==========================================
  // PROFILE TYPE
  // ==========================================

  let typeLabel = "👤 Other";

  if (profileSearchType === "bride") {
    typeLabel = "👰 Bride";
  }

  else if (profileSearchType === "groom") {
    typeLabel = "🤵 Groom";
  }


  // ==========================================
  // DISTRICT
  // ==========================================

  let districtLabel =
    profileSearchDistrict === "all"
      ? "सर्व जिल्हे"
      : profileSearchDistrict;


  // ==========================================
  // EDUCATION
  // ==========================================

  const educationLabels = {

    Engineering:
      "Engineering & Technology",

    Medical:
      "Medical & Healthcare",

    Commerce:
      "Commerce & Management",

    Arts:
      "Arts & Humanities",

    Science:
      "Science & Agriculture",

    Diploma:
      "Diploma / ITI / Technical",

    Law:
      "Law / Architecture / Design",

    General:
      "General Education",

    all:
      "कोणतेही शिक्षण"

  };


  const educationLabel =
    educationLabels[profileSearchEducation] ||
    profileSearchEducation ||
    "कोणतेही शिक्षण";


  // ==========================================
  // INCOME
  // ==========================================

  let incomeLabel = "कोणतेही उत्पन्न";


  if (
    profileSearchIncome &&
    profileSearchIncome !== "all"
  ) {

    incomeLabel =
      profileSearchIncome
        .replace("मासिक उत्पन्न", "")
        .replace("रु.", "₹")
        .trim();

  }


  // ==========================================
  // RETURN FILTER BOX
  // ==========================================

  return `

    <div class="selected-filters">

      <div class="selected-filters-title">
        🔎 <b>Selected Filters</b>
      </div>

      <div class="selected-filter-row">
        <b>Profile:</b>
        ${typeLabel}
      </div>

      <div class="selected-filter-row">
        <b>📍 District:</b>
        ${escapeHtml(districtLabel)}
      </div>

      <div class="selected-filter-row">
        <b>🎓 Education:</b>
        ${escapeHtml(educationLabel)}
      </div>

      <div class="selected-filter-row">
        <b>💰 Monthly Income:</b>
        ${escapeHtml(incomeLabel)}
      </div>

    </div>

  `;

}
/* =========================================
   USER MESSAGE
========================================= */

function userMessage(message) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `

    <div class="user">

      ${message}

    </div>

  `;

  scrollChat();

}


/* =========================================
   MAIN MENU
========================================= */

function showMenu() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `

    <div class="menu">

      <button
        onclick="menuClick('registration')">

        📝 Registration

      </button>


      <button
        onclick="menuClick('ebook')">

        📘 Download E-book

      </button>


      <button

      </button>


      <button
        onclick="menuClick('groom')">

      </button>

      <button onclick="menuClick('other')">

      </button>

      <button
        onclick="menuClick('contact')">

      </button>

      <button
        class="option-btn"
        onclick="showLikedProfiles()"
      >
        ❤️ Liked Profiles
      </button>

      <button
        class="option-btn"
        onclick="showDislikedProfiles()"
      >
        👎 Disliked Profiles
      </button>

      <button
        type="button"
        onclick="showReceivedInterests()"
      >
        📥 Received Interests
      </button>

      <button
        type="button"
        onclick="showSentInterests()"
      >
        📤 Sent Interests
      </button>

      <button
        type="button"
        id="likesReceivedBtn"
        class="option-btn"
        onclick="showLikesReceived()"
      >

        ❤️ Likes Received

      </button>

     


      <button onclick="requestProfileSearchAccess('matching')">
          ❤️ Matching Profiles
      </button>

       <button

    function showLikesReceived() {

        if (!profileAccessVerified) {

          pendingProfileCategory =
            "likesReceived";

          botMessage(`
            🔐 <b>Verification Required</b>

            <br><br>

            Likes पाहण्यासाठी
            प्रथम Registered Mobile Number Verify करा.
          `);

              chatbotState =
                "profile_mobile_verification";


              const input =
                document.getElementById("message");


              input.placeholder =
                "Enter registered mobile number...";


              input.focus();

              return;
        }

        botMessage("⏳ Loading Likes...");

        google.script.run

          .withSuccessHandler(function(result) {

            if (!result || !result.success) {

              botMessage(
                "तुम्हाला अद्याप कोणतीही Like मिळालेली नाही."
              );

              return;
            }

            renderLikesReceived(result);

          })

          .withFailureHandler(function(error) {

            console.error(error);

            botMessage(
              "❌ Likes load करण्यात अडचण आली."
            );

          })

          .getLikedReceivedProfiles(
            profileUserMobile
          );

      }


  function renderLikesReceived(result) {

    let html = `

    <div class="profile-card">

        <div class="profile-name">

            ❤️ Likes Received (${result.totalLikes})

        </div>

    `;

    lastRenderedProfiles =
    result.profiles;

    result.profiles.forEach(function(profile){

        const actionButtons =
            buildProfileActionButtons(

                profile,

                profile.relationship

            );

        html += `

        <div class="full-profile-row">

            👤 <b>${profile.viewerName}</b><br>

            📅 ${profile.likedAt}

            <br><br>

            ${actionButtons}

            <hr>

        </div>

        `;

    });

        html += `</div>`;

        botMessage(html);

  }


function loadVerifiedEbook() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function (data) {

        hideTyping();


        if (
          !data ||
          !data.ebook
        ) {

          botMessage(

            "⚠️ E-book is currently unavailable."

          );

          return;

        }


        const ebook =
          data.ebook;


        botMessage(`

          📘 <b>${ebook.title}</b>

          <br><br>

          Your registration has been verified.

          <br><br>

          <a
            class="chat-action-button"
            href="${ebook.url}"
            target="_blank"
            rel="noopener noreferrer">

            📘 Access E-book

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);


        botMessage(

          "⚠️ Unable to load the E-book."

        );

      }
    )

    .getChatLinks();

}

function showRegistrationButton() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function (data) {

        hideTyping();


        if (
          !data ||
          !data.registration
        ) {

          botMessage(

            "Please use the Registration option from the main menu."

          );

          return;

        }


        botMessage(`

          <a
            class="chat-action-button"
            href="${data.registration.url}"
            target="_blank"
            rel="noopener noreferrer">

            📝 Register Your Name

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);

      }
    )

    .getChatLinks();

}

function verifyEbookMobile(mobile) {

  // Remove spaces from beginning/end
  mobile = mobile.trim();

  if (mobile === "") {

    botMessage(
      "⚠️ Please enter your registered mobile number."
    );

    return;
  }


  // Show typing while checking Google Sheet
  showTyping();


  google.script.run

    .withSuccessHandler(function(result) {

      hideTyping();

      // No response received
      if (!result) {

        botMessage(
          "⚠️ No response received from the verification system."
        );

        return;
      }


      // ==========================================
      // REGISTERED USER
      // ==========================================

      if (
        result.success === true &&
        result.verified === true
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ✅ <b>Registration Verified</b>

          <br><br>

          Welcome,
          <b>${escapeHtml(result.name)}</b>

          <br><br>

          Your mobile number is registered
          with Devang Pustika.

        `);


        // Show E-book after verification
        loadVerifiedEbook();

        return;
      }


      // ==========================================
      // INVALID MOBILE NUMBER
      // ==========================================

      if (
        result.invalidMobile === true
      ) {

        botMessage(`

          ⚠️ <b>Invalid Mobile Number</b>

          <br><br>

          Please enter a valid
          10-digit mobile number.

          <br><br>

          Example: 9876543210

        `);

        return;
      }


      // ==========================================
      // NOT REGISTERED
      // ==========================================

      if (
        result.success === true &&
        result.verified === false
      ) {

        chatbotState = "normal";

        resetChatInput();


        botMessage(`

          ⚠️ <b>Mobile Number Not Registered</b>

          <br><br>

          This mobile number was not found
          in our registration records.

          <br><br>

          Please register your name first
          to access the E-book.

        `);


        showRegistrationButton();

        return;
      }


      // ==========================================
      // OTHER SERVER ERROR
      // ==========================================

      chatbotState = "normal";

      resetChatInput();


      botMessage(
        "⚠️ " +
        (
          result.message ||
          "Unable to verify your registration."
        )
      );

    })


    .withFailureHandler(function(error) {

      hideTyping();

      chatbotState = "normal";

      resetChatInput();

      console.error(
        "Verification Error:",
        error
      );


      botMessage(`

        ⚠️ <b>Verification Error</b>

        <br><br>

        ${error.message || error}

      `);

    })


    .verifyEbookUser(mobile);

}



function requestProfileSearchAccess(type) {

  type =
    String(
      type || ""
    )
    .trim()
    .toLowerCase();


  // ==========================================
  // MATCHING PROFILES REQUEST
  // ==========================================

  if (
    type === "matching"
  ) {

    // ------------------------------------------
    // ALREADY VERIFIED
    // ------------------------------------------

    if (
      profileAccessVerified &&
      profileUserId &&
      profileUserType
    ) {

      showMatchingProfiles();

      return;

    }


    // ------------------------------------------
    // WAIT FOR MOBILE VERIFICATION
    // ------------------------------------------

    pendingProfileCategory =
      "matching";


    chatbotState =
      "profile_mobile_verification";


    botMessage(`

      🔐 <b>Matching Profiles Verification</b>

      <br><br>

      Matching Profiles पाहण्यासाठी आपला
      नोंदणीकृत मोबाईल नंबर टाका.

      <br><br>

      📱 <b>10 अंकी मोबाईल नंबर टाका.</b>

    `);


    const input =
      document.getElementById(
        "message"
      );


    if (input) {

      input.placeholder =
        "Enter registered mobile number...";

      input.focus();

    }


    return;

  }


  // ==========================================
  // EXISTING PROFILE SEARCH FLOW
  // ==========================================

  pendingProfileSearchType =
    type;


  // ==========================================
  // ALREADY VERIFIED IN CURRENT SESSION
  // ==========================================

  if (
    profileAccessVerified
  ) {

    startProfileSearch(
      type
    );

    return;

  }


  // ==========================================
  // WAIT FOR MOBILE NUMBER
  // ==========================================

  chatbotState =
    "profile_mobile_verification";


  botMessage(`

    🔐 <b>Profile Search Verification</b>

    <br><br>

    प्रोफाइल शोधण्यासाठी आपला
    नोंदणीकृत मोबाईल नंबर टाका.

    <br><br>

    📱 <b>10 अंकी मोबाईल नंबर टाका.</b>

  `);


  const input =
    document.getElementById(
      "message"
    );


  if (input) {

    input.placeholder =
      "Enter registered mobile number...";

    input.focus();

  }

}

   MENU CLICK
========================================= */

function menuClick(option) {

  switch (option) {

    case "registration":

      userMessage(
        "📝 Registration"
      );

      loadLink(
        "registration"
      );

      break;


      case "ebook":

        userMessage(
          "📘 Download E-book"
        );

        startEbookVerification();

        break;


    case "contact":

      userMessage(
        "☎ Contact Us"
      );

      loadLink(
        "contact"
      );

      break;


      case "bride":

      userMessage(
        "👰 Search Bride"
      );

        requestProfileSearchAccess(
          "bride"
        );

      break;

        case "groom":

        userMessage(
          "🤵 Search Groom"
        );

        requestProfileSearchAccess(
          "groom"
        );

        break;

    case "other":

      userMessage(
        "👤 Search Other"
      );

       requestProfileSearchAccess(
        "other"
      );

      break;  

  }

}




function verifyProfileMobile(mobile) {

  // ==========================================
  // CLEAN MOBILE NUMBER
  // ==========================================

  const cleanMobile =
    String(
      mobile || ""
    )
    .replace(/\D/g, "");


  // ==========================================
  // VALIDATE MOBILE NUMBER
  // ==========================================

  if (
    cleanMobile.length !== 10
  ) {

    botMessage(
      "⚠️ कृपया योग्य 10 अंकी मोबाईल नंबर टाका."
    );

    return;

  }


  // ==========================================
  // SHOW LOADING
  // ==========================================

  showTyping();


  // ==========================================
  // VERIFY MOBILE
  // ==========================================

  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        // ==========================================
        // LOG BACKEND RESPONSE
        // ==========================================

        console.log(
          "VERIFY PROFILE SEARCH ACCESS RESULT:",
          result
        );


        // ==========================================
        // VERIFY SUCCESS
        // ==========================================

        if (
          result &&
          (
            result.verified === true ||
            result.registered === true
          )
        ) {


          // ==========================================
          // GET VERIFIED USER OBJECT
          // ==========================================

          const user =
            result.user ||
            result;


          // ==========================================
          // SET VERIFIED ACCESS STATE
          // ==========================================

          profileAccessVerified =
            true;


          // ==========================================
          // SET VERIFIED MOBILE
          // ==========================================

          profileUserMobile =
            String(
              user.mobile ||
              cleanMobile ||
              ""
            )
            .trim();


          // ==========================================
          // SET VERIFIED USER NAME
          // ==========================================

          profileUserName =
            String(
              user.name ||
              ""
            )
            .trim();


          // ==========================================
          // SET REGISTERED SHEET
          // ==========================================

          profileUserRegisteredSheet =
            String(
              user.registeredSheet ||
              ""
            )
            .trim();


          // ==========================================
          // SET PROFILE TYPE
          // ==========================================

          profileUserType =
            String(
              user.profileType ||
              ""
            )
            .trim()
            .toLowerCase();


          // ==========================================
          // SET PROFILE ID
          // ==========================================

          profileUserId =
            String(
              user.profileId ||
              ""
            )
            .trim();


          // ==========================================
          // DEBUG VERIFIED USER
          // ==========================================

          console.log(
            "VERIFIED USER PROFILE SET:",
            {

              profileUserId:
                profileUserId,

              profileUserType:
                profileUserType,

              profileUserMobile:
                profileUserMobile,

              profileUserName:
                profileUserName,

              profileUserRegisteredSheet:
                profileUserRegisteredSheet,

              profileAccessVerified:
                profileAccessVerified

            }
          );


          // ==========================================
          // VERIFY REQUIRED PROFILE IDENTITY
          // ==========================================

          if (
            !profileUserId ||
            !profileUserType ||
            !profileUserMobile
          ) {

            console.error(
              "❌ VERIFIED USER IDENTITY INCOMPLETE:",
              {

                result:
                  result,

                user:
                  user,

                profileUserId:
                  profileUserId,

                profileUserType:
                  profileUserType,

                profileUserMobile:
                  profileUserMobile

              }
            );


            // ------------------------------------------
            // RESET ACCESS STATE
            // ------------------------------------------

            profileAccessVerified =
              false;


            profileUserId =
              "";

            profileUserType =
              "";

            profileUserMobile =
              "";

            profileUserName =
              "";

            profileUserRegisteredSheet =
              "";


            chatbotState =
              "normal";


            botMessage(`

              ⚠️ <b>Profile information incomplete.</b>

              <br><br>

              तुमच्या verified profile ची आवश्यक माहिती
              मिळाली नाही.

              <br><br>

              कृपया पुन्हा प्रयत्न करा.

            `);


            return;

          }


          // ==========================================
          // NORMAL CHATBOT STATE
          // ==========================================

          chatbotState =
            "normal";


          // ==========================================
          // VERIFICATION SUCCESS MESSAGE
          // ==========================================

          botMessage(`

            ✅ <b>Verification Successful</b>

            <br><br>

            नमस्कार
            <b>${escapeHtml(
              profileUserName
            )}</b>

          `);


          // ==========================================
          // USER CAME FROM LIKED PROFILES
          // ==========================================

          if (
            pendingProfileCategory ===
            "liked"
          ) {

            pendingProfileCategory =
              "";

            showLikedProfiles();

            return;

          }


          // ==========================================
          // USER CAME FROM DISLIKED PROFILES
          // ==========================================

          if (
            pendingProfileCategory ===
            "disliked"
          ) {

            pendingProfileCategory =
              "";

            showDislikedProfiles();

            return;

          }


          // ==========================================
          // USER WAITING FOR SENT INTERESTS
          // ==========================================

          if (
            pendingProfileCategory ===
            "sentInterests"
          ) {

            pendingProfileCategory =
              "";

            showSentInterests();

            return;

          }


          // ==========================================
          // RECEIVED INTERESTS AFTER VERIFICATION
          // ==========================================

          if (
            pendingProfileCategory ===
            "receivedInterests"
          ) {

            pendingProfileCategory =
              "";

            showReceivedInterests();

            return;

          }


          // ==========================================
          // LIKES RECEIVED AFTER VERIFICATION
          // ==========================================

          if (
            pendingProfileCategory ===
            "likesReceived"
          ) {

            pendingProfileCategory =
              "";

            showLikesReceived();

            return;

          }


          // ==========================================
          // MATCHING PROFILES AFTER VERIFICATION
          // ==========================================

          if (
            pendingProfileCategory ===
            "matching"
          ) {

            pendingProfileCategory =
              "";

            showMatchingProfiles();

            return;

          }


          // ==========================================
          // NORMAL PROFILE SEARCH FLOW
          // ==========================================

          if (
            pendingProfileSearchType
          ) {

            const searchType =
              pendingProfileSearchType;


            pendingProfileSearchType =
              "";


            startProfileSearch(
              searchType
            );

            return;

          }


          // ==========================================
          // NORMAL VERIFICATION
          // ==========================================

          botMessage(`

function searchChatProfiles() {

  showTyping();


  google.script.run

    .withSuccessHandler(
      function(result) {

        hideTyping();


        chatbotState =
          "normal";


        if (!result) {

          botMessage(
            "⚠️ Search response not received."
          );

          return;

        }


        if (
          result.success !== true
        ) {

          botMessage(
            "⚠️ " +
            (
              result.message ||
              "Unable to search profiles."
            )
          );

          return;

        }


        if (
          !result.profiles ||
          result.profiles.length === 0
        ) {

          botMessage(`

            🔍 <b>No matching profiles found.</b>

            <br><br>

            Please try another district.

          `);


          showSearchAgainButton();

          return;

        }


            const fromProfile =
          ((result.page - 1) * result.pageSize) + 1;


        const toProfile =
          Math.min(
            result.page * result.pageSize,
            result.totalCount
          );


                  const resultSectionId =
            "profile-results-" + Date.now();


          const selectedFiltersHtml =
            getSelectedFiltersHtml();


          botMessage(`

            <div id="${resultSectionId}">

              🔍 <b>${result.totalCount} Matching Profiles Found</b>

              <br><br>

              ${selectedFiltersHtml}

              <br>

              <div class="result-count">

                Showing profiles
                <b>${fromProfile} – ${toProfile}</b>
                of
                <b>${result.totalCount}</b>

                <br>

                Page
                <b>${result.page}</b>
                of
                <b>${result.totalPages}</b>

              </div>

            </div>

          `);     

          displayProfileResults(
            result.profiles,
            result.page,
            result.pageSize
          );
          
        saveProfileSearchLog(result);
        showProfilePagination(result);

        setTimeout(function() {

            const resultSection =
              document.getElementById(
                resultSectionId
              );


              if (resultSection) {

                resultSection.scrollIntoView({
                  behavior: "smooth",
                  block: "start"
                });

              }

          }, 100);

        }
      )


    .withFailureHandler(
      function(error) {

        hideTyping();

        chatbotState =
          "normal";


        console.error(
          "Profile Search Error:",
          error
        );


        botMessage(

          "⚠️ Unable to search profiles. Please try again."

        );

      }
    )


      .searchProfiles(
        profileSearchType,
        profileSearchDistrict,
        profileSearchEducation,
        profileSearchIncome,
        profileSearchPage,
        profileUserMobile
      );

}

function displayProfileResults(

    profiles,

    page,

    pageSize

) {

    const pageScrollMarkerId =
        "profile-search-page-" +
        String(page) +
        "-" +
        Date.now();


    lastRenderedProfiles =
    profiles;


    let cardsHtml = "";


    profiles.forEach(
        function(profile, index) {


            // ========================================
            // PROFILE DISPLAY DATA
            // ========================================

            const profileData =
                prepareProfileDisplayData(
                    profile,
                    profileSearchType
                );


            const {
                currentProfileType,
                currentProfileId,
                currentProfileName,
                profileIcon,
                district,
                education,
                age,
                height,
                caste,
                job,
                income,
                photo
            } = profileData;


            // ========================================
            // COMMON INTEREST UI
            // ========================================

            const interestUI =
                getProfileInterestActions(
                    profile,
                    currentProfileType,
                    currentProfileId,
                    currentProfileName
                );


            // ========================================
            // REACTION UI
            // ========================================


            const profileActions =
                buildProfileActionButtons(
                    profile,
                    profile.relationship
                );

            // ========================================
            // PROFILE PHOTO
            // ========================================

            const photoHtml =
                buildProfilePhoto({

                    photo:
                        photo,

                    profileType:
                        currentProfileType,

                    markerId:
                        pageScrollMarkerId

                });


            // ========================================
            // PROFILE HEADER
            // ========================================

            const headerHtml =
                buildProfileHeader({

                    icon:
                        profileIcon,

                    profileNumber:
                        (
                            (page - 1) *
                            pageSize
                        ) +
                        index +
                        1,

                    name:
                        currentProfileName || "-"

                });


            // ========================================
            // PROFILE DETAILS
            // ========================================

            const detailsHtml =
              buildProfileDetails({

                  district:
                      district,

                  education:
                      education,

                  age:
                      age,

                  height:
                      height,

                  caste:
                      caste,

                  job:
                      job,

                  income:
                      income

              });

            // ========================================
            // INTEREST STATUS
            // ========================================

            const interestStatusHtml =
                interestUI.statusHtml || "";


            // ========================================
            // INTEREST ACTION
            // ========================================

            const interestActionHtml =
                interestUI.actionHtml || "";


            // ========================================
            // REACTION HTML
            // ========================================

            const reactionHtml =
                profileActions || "";


            // ========================================
            // BUILD COMPLETE PROFILE CARD
            // ========================================

            cardsHtml +=
                buildProfileCard({

                    photoHtml:
                        photoHtml,

                    headerHtml:
                        headerHtml,

                    detailsHtml:
                        detailsHtml,

                    interestStatusHtml:
                        interestStatusHtml,

                    interestActionHtml:
                        interestActionHtml,

                    reactionHtml:
                        reactionHtml

                });


        }
    );


    // ========================================
    // RENDER PROFILE CARDS
    // ========================================

    botMessage(
        cardsHtml
    );


    // ========================================
    // SCROLL TO FIRST PROFILE OF THIS PAGE
    // ========================================

    scrollToCurrentProfilePage(
        pageScrollMarkerId
    );

}

    profileSearchPage <= 1

    return;

  // Go to previous page
  profileSearchPage =
    profileSearchPage - 1;


  // Reload using SAME search filters
  loadCurrentProfileSearchPage();

  loadCurrentProfileSearchPage();

/* =========================================

========================================= */

function loadLink(key) {

  showTyping();

  google.script.run

    .withSuccessHandler(
      function (data) {

        hideTyping();

        if (
          !data ||
          !data[key]
        ) {

          botMessage(
            "⚠️ Link is currently unavailable."
          );

          return;

        }

        const item =
          data[key];


        let buttonText =
          "Open";


        if (
          key === "registration"
        ) {

          buttonText =
            "📝 Register Now";

        }


        if (
          key === "ebook"
        ) {

          buttonText =
            "📘 Open E-book";

        }


        if (
          key === "contact"
        ) {

          buttonText =
            "☎ Contact Us";

        }


        botMessage(`

          <b>
            ${item.title}
          </b>

          <br><br>

          <a
            class="chat-action-button"
            href="${item.url}"
            target="_blank"
            rel="noopener noreferrer">

            ${buttonText}

          </a>

        `);

      }
    )

    .withFailureHandler(
      function (error) {

        hideTyping();

        console.error(error);

        botMessage(
          "⚠️ Unable to load the link."
        );

      }
    )

    .getChatLinks();

}

function escapeJsValue(value) {

  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "")
    .replace(/\n/g, "\\n");

}

function updateProfileReactionState(
    profile,
    relationship
) {

    if (
        !profile ||
        !relationship

        relationship;

    profile.reaction =
        relationship.canLike

function updateReactionButtons(
    type,
    profileId,
    relationship
) {

    // ========================================
    // VALIDATION
    // ========================================

    if (!relationship) {

        console.warn(
            "Relationship missing."
        );

        return;

    }

    // ========================================
    // KEY
    // ========================================

    const key =
        String(type).toLowerCase() +
        "_" +
        String(profileId);

    // ========================================
    // FIND ACTION CONTAINER
    // ========================================

      const containers =
          document.querySelectorAll(
              `[data-actions="${key}"]`
          );

      if (!containers.length) {

          console.warn(
              "Action container not found:",
              key
          );

          return;

      }

    // ========================================
    // FIND PROFILE OBJECT
    // ========================================

    let profile = null;

                if (
                    Array.isArray(
                        lastRenderedProfiles
                    )
                ) {

                  profile =
                  lastRenderedProfiles.find(function(p){

                return (

                    String(
                        p.viewerProfileType || p.type
                    ).toLowerCase() ===
                    String(type).toLowerCase()

                    &&

                    String(
                        p.viewerProfileId || p.id
                    ) ===
                    String(profileId)

                );

            });

    }

    if (!profile) {

        console.warn(
            "Profile not found."
        );

        return;

    }

    // ========================================
    // UPDATE LOCAL STATE
    // ========================================

    updateProfileReactionState(
        profile,
        relationship
    );

    // ========================================
    // BUILD NEW HTML
    // ========================================

        const html =
        buildProfileActionButtons(
            profile,
            relationship
        );

        containers.forEach(function(container){

            container.outerHTML = html;

        });

}

function scrollProfileSectionToTop(
  sectionId
) {

  setTimeout(function() {

    const chat =
      document.getElementById("chat");

    const section =
      document.getElementById(
        sectionId
      );


    if (
      !chat ||
      !section
    ) {

      return;

    }


    // Section position relative to chat container
    const chatRect =
      chat.getBoundingClientRect();


    const sectionRect =
      section.getBoundingClientRect();


    const targetTop =
      chat.scrollTop +
      sectionRect.top -
      chatRect.top -
      10;


    chat.scrollTo({

      top:
        targetTop,

      behavior:
        "smooth"

    });

  }, 300);

}

                profile,
                relationship

            ${buildDislikeButton(
                profile,
                relationship
            )}

            ${buildViewProfileButton(
                profile
            )}

        </div>

    `;

}



function handleChatbotLogout() {

  // ==========================================
  // CHECK SESSION
  // ==========================================

  if (
    typeof authUISessionId === "undefined" ||
    !authUISessionId
  ) {

    console.warn(
      "No active authentication session."
    );

    return;

  }


  // ==========================================
  // LOGOUT CONFIRMATION
  // ==========================================

  const confirmed =
    confirm(
      "Are you sure you want to logout?"
    );


  if (!confirmed) {

    return;

  }


  // ==========================================
  // SERVER-SIDE LOGOUT
  // ==========================================

  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          "Logout result:",
          result
        );


        if (
          !result ||
          result.success !== true
        ) {

          alert(
            "Logout failed. Please try again."
          );

          return;

        }


        // ======================================
        // CLEAR FRONTEND SESSION
        // ======================================

        authUISessionId =
          "";

        authUIRequestId =
          "";

        authUIMobile =
          "";

        authUIUser =
          null;

        authUIState =
          "LOGIN_REQUIRED";


        // ======================================
        // HIDE CHATBOT
        // ======================================

        const chatbotWrapper =
          document.getElementById(
            "chatbotWrapper"
          );

        if (chatbotWrapper) {

          chatbotWrapper.style.display =
            "none";

        }


        // ======================================
        // SHOW LOGIN UI
        // ======================================

        const authContainer =
          document.getElementById(
            "authContainer"
          );

        if (authContainer) {

          authContainer.style.display =
            "flex";

        }


        // ======================================
        // RESET AUTH SCREEN
        // ======================================

        if (
          typeof authShowScreen ===
          "function"
        ) {

          authShowScreen(
            "authLoginScreen"
          );

        }


        console.log(
          "✅ User logged out successfully."
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          "Logout error:",
          error
        );

        alert(
          "Logout failed. Please try again."
        );

      }
    )

    .logoutLoginSession(
      authUISessionId
    );

}
