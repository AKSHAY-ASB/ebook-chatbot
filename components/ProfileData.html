<script>

// ==========================================
// FILE : ProfileData.html
// MODULE : Profile Components
// PURPOSE : Normalize common profile display data
//
// RESPONSIBILITY
//  - Prepare common profile values
//  - Normalize profile type / ID / name
//  - Prepare safe button values
//  - Resolve profile icon
//  - Prepare common display values
//
// USED BY
//  - displayProfileResults()
//  - displayLikedProfileCard()
//  - displayDislikedProfileCard()
//  - buildMatchingProfileCard()
//
// IMPORTANT
//  - No rendering
//  - No DOM manipulation
//  - No backend calls
//  - No business logic
// ==========================================


function prepareProfileDisplayData(
    profile,
    fallbackProfileType
) {

    profile =
        profile || {};


    // ========================================
    // PROFILE BASIC VALUES
    // ========================================

    const currentProfileType =
        String(
            profile.type ||
            fallbackProfileType ||
            ""
        )
        .trim()
        .toLowerCase();


    const currentProfileId =
        String(
            profile.id || ""
        )
        .trim();


    const currentProfileName =
        String(
            profile.name || ""
        )
        .trim();


    // ========================================
    // SAFE VALUES FOR BUTTONS
    // ========================================

    const safeType =
        escapeJsValue(
            currentProfileType
        );


    const safeId =
        escapeJsValue(
            currentProfileId
        );


    const safeName =
        escapeJsValue(
            currentProfileName
        );


    const safeOwnerMobile =
        escapeJsValue(
            profile.ownerMobile || ""
        );


    // ========================================
    // PROFILE ICON
    // ========================================

    const profileIcon =
        getProfileIcon(
            currentProfileType
        );


    // ========================================
    // DISPLAY VALUES
    //
    // IMPORTANT
    // Matching normalized profile contains
    // some values as objects.
    //
    // Example:
    //
    // district:
    // {
    //   raw: "अहमदनगर",
    //   normalized: "..."
    // }
    //
    // education:
    // {
    //   raw: "MCOM MBA",
    //   ...
    // }
    //
    // Therefore use RAW display value first.
    // ========================================


    // ----------------------------------------
    // NAME
    // ----------------------------------------

    const name =
        currentProfileName || "-";


    // ----------------------------------------
    // DISTRICT
    // ----------------------------------------

    const district =
        profile.district &&
        typeof profile.district === "object"

            ? (
                profile.district.raw ||
                profile.district.normalized ||
                "-"
              )

            : (
                profile.district ||
                "-"
              );


    // ----------------------------------------
    // EDUCATION
    // ----------------------------------------

    const education =
        profile.educationRaw ||
        (
            profile.education &&
            typeof profile.education === "object"

                ? (
                    profile.education.raw ||
                    profile.education.normalized ||
                    "-"
                  )

                : profile.education
        ) ||
        "-";


    // ----------------------------------------
    // AGE
    // ----------------------------------------

    const age =
        profile.ageRaw ||
        (
            profile.age &&
            typeof profile.age === "object"

                ? (
                    profile.age.raw ||
                    profile.age.display ||
                    profile.age.formatted ||
                    profile.age.value ||
                    "-"
                  )

                : profile.age
        ) ||
        "-";


    // ----------------------------------------
    // HEIGHT
    // ----------------------------------------

    const height =
        profile.heightRaw ||
        (
            profile.height &&
            typeof profile.height === "object"

                ? (
                    profile.height.raw ||
                    profile.height.display ||
                    profile.height.formatted ||
                    profile.height.value ||
                    "-"
                  )

                : profile.height
        ) ||
        "-";


    // ----------------------------------------
    // CASTE
    // ----------------------------------------

    const caste =
        profile.casteRaw ||
        (
            profile.caste &&
            typeof profile.caste === "object"

                ? (
                    profile.caste.raw ||
                    profile.caste.normalized ||
                    "-"
                  )

                : profile.caste
        ) ||
        "-";


    // ----------------------------------------
    // JOB / PROFESSION
    // ----------------------------------------

    const job =
        profile.professionRaw ||
        (
            profile.profession &&
            typeof profile.profession === "object"

                ? (
                    profile.profession.raw ||
                    profile.profession.normalized ||
                    "-"
                  )

                : profile.profession
        ) ||
        "-";


    // ----------------------------------------
    // INCOME
    // ----------------------------------------

    const income =
        profile.incomeRaw ||
        (
            profile.income &&
            typeof profile.income === "object"

                ? (
                    profile.income.raw ||
                    profile.income.display ||
                    profile.income.formatted ||
                    profile.income.value ||
                    "-"
                  )

                : profile.income
        ) ||
        "-";


    // ----------------------------------------
    // PHOTO
    // ----------------------------------------

    const photo =
        profile.photo || "";


    // ========================================
    // RETURN NORMALIZED DISPLAY DATA
    // ========================================

    return {

        profile:
            profile,

        currentProfileType:
            currentProfileType,

        currentProfileId:
            currentProfileId,

        currentProfileName:
            currentProfileName,

        safeType:
            safeType,

        safeId:
            safeId,

        safeName:
            safeName,

        safeOwnerMobile:
            safeOwnerMobile,

        profileIcon:
            profileIcon,

        name:
            name,

        district:
            district,

        education:
            education,

        age:
            age,

        height:
            height,

        caste:
            caste,

        job:
            job,

        income:
            income,

        photo:
            photo

    };

}

</script>
