<script>

// ==========================================
// LIKE BUTTON
// ==========================================

// ==========================================
// LIKE BUTTON
// ==========================================

function buildLikeButton(
    profile,
    relationship
) {

    profile =
        profile || {};

    relationship =
        relationship || {};


    const profileType =
        profile.viewerProfileType ||
        profile.type ||
        "";


    const profileId =
        profile.viewerProfileId ||
        profile.id ||
        "";


    const profileName =
        profile.viewerName ||
        profile.name ||
        "";


    const ownerMobile =
        profile.viewerMobile ||
        profile.ownerMobile ||
        profile.mobile ||
        "";


    const relationshipStatus =
        String(
            relationship.status ||
            ""
        )
        .trim()
        .toUpperCase();


    // ==========================================
    // LIKE STATE
    //
    // OUTGOING_LIKE = User has liked profile
    // MUTUAL_LIKE   = Both users have liked
    // ==========================================

    const isLiked =
        relationshipStatus === "OUTGOING_LIKE" ||
        relationshipStatus === "MUTUAL_LIKE";


    let className =
        "profile-reaction-btn";


    if (
        relationshipStatus ===
        "MUTUAL_LIKE"
    ) {

        className +=
            " mutual";

    }

    else if (
        relationshipStatus ===
        "OUTGOING_LIKE"
    ) {

        className +=
            " liked";

    }


    // ==========================================
    // BUTTON LABEL
    // ==========================================

    const likeLabel =
        isLiked

            ? "❤️ Liked"

            : (
                relationship.likeLabel ||
                "♡ Like"
            );


    // ==========================================
    // BUTTON DISABLED STATE
    // ==========================================

    const isDisabled =
        relationship.canLike === false ||
        isLiked;


    return `

        <button
            type="button"

            class="${className}"

            ${isDisabled ? "disabled" : ""}

            onclick="
                ${
                    isDisabled
                        ? ""
                        : `reactToProfile(
                            '${escapeJsValue(profileType)}',
                            '${escapeJsValue(profileId)}',
                            '${escapeJsValue(profileName)}',
                            '${escapeJsValue(ownerMobile)}',
                            'LIKE',
                            this
                        )`
                }
            "

        >

            ${likeLabel}

        </button>

    `;
}


// ==========================================
// DISLIKE BUTTON
// ==========================================

function buildDislikeButton(
    profile,
    relationship
) {
    relationship =
        relationship || {};

    const profileType =
        profile.viewerProfileType ||
        profile.type ||
        "";

    const profileId =
        profile.viewerProfileId ||
        profile.id ||
        "";

    const profileName =
        profile.viewerName ||
        profile.name ||
        "";

    const ownerMobile =
        profile.viewerMobile ||
        profile.ownerMobile ||
        "";

    return `

        <button
            type="button"

            class="profile-reaction-btn"

            ${relationship.canDislike === false ? "disabled" : ""}

            onclick="reactToProfile(

                '${escapeJsValue(profileType)}',

                '${escapeJsValue(profileId)}',

                '${escapeJsValue(profileName)}',

                '${escapeJsValue(ownerMobile)}',

                'DISLIKE',

                this

            )"

        >

            ${relationship.dislikeLabel || "👎 Dislike"}

        </button>

    `;

}

</script>
