<script>

// ==========================================
// LIKE BUTTON
// ==========================================

// ==========================================
// LIKE BUTTON
// ==========================================

function buildLikeButton(
  profile,
  relationship
) {

  let className =
    "profile-reaction-btn";

  let label =
    "♡ Like";


  // ==========================================
  // MUTUAL MATCH
  // BOTH USERS LIKED EACH OTHER
  // ==========================================

  if (
    relationship &&
    relationship.status === "MUTUAL_LIKE"
  ) {

    className += " mutual";

    label =
      "❤️ Matched";

  }


  // ==========================================
  // CURRENT USER LIKED
  // ==========================================

  else if (
    relationship &&
    relationship.status === "OUTGOING_LIKE"
  ) {

    className += " liked";

    label =
      "❤️ Liked";

  }


  // ==========================================
  // RETURN BUTTON
  // ==========================================

  const disabled =
    relationship &&
    relationship.canLike === false
      ? "disabled"
      : "";


  return `
    <button
      type="button"
      class="${className}"
      ${disabled}

      onclick="reactToProfile(
        '${profile.viewerProfileType || profile.type}',
        '${profile.viewerProfileId || profile.id}',
        '${profile.viewerName || profile.name}',
        '${profile.viewerMobile || profile.ownerMobile}',
        'LIKE',
        this
      )">

      ${label}

    </button>
  `;
}


// ==========================================
// DISLIKE BUTTON
// ==========================================

function buildDislikeButton(
    profile,
    relationship
) {
    relationship =
        relationship || {};

    const profileType =
        profile.viewerProfileType ||
        profile.type ||
        "";

    const profileId =
        profile.viewerProfileId ||
        profile.id ||
        "";

    const profileName =
        profile.viewerName ||
        profile.name ||
        "";

    const ownerMobile =
        profile.viewerMobile ||
        profile.ownerMobile ||
        "";

    return `

        <button
            type="button"

            class="profile-reaction-btn"

            ${relationship.canDislike === false ? "disabled" : ""}

            onclick="reactToProfile(

                '${escapeJsValue(profileType)}',

                '${escapeJsValue(profileId)}',

                '${escapeJsValue(profileName)}',

                '${escapeJsValue(ownerMobile)}',

                'DISLIKE',

                this

            )"

        >

            ${relationship.dislikeLabel || "👎 Dislike"}

        </button>

    `;

}

</script>
